<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="dark">
  <title>Sub Bar Overlay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      background: #0a1020; /* dark canvas — visible in browsers; OBS: see README */
    }

    body {
      width: 1280px;
      background: transparent;
      -webkit-font-smoothing: antialiased;
      font-family: Arial, sans-serif;
    }

    /* ════════════════════════════════════════
       BAR
    ════════════════════════════════════════ */
    .bar-container {
      width: 1280px;
      height: 110px;
      background: #2d3f6e;
      border-radius: 10px;
      padding: 0 14px 4px;
      display: flex;
      flex-direction: column;
    }

    .indicator-row {
      flex: 0 0 48px;
      position: relative;
    }

    .indicator {
      position: absolute;
      bottom: 2px;
      display: flex;
      align-items: flex-end;
      gap: 6px;
    }

    .sub-count-box {
      background: #182848;
      border: 2.5px solid #5888ee;
      border-radius: 7px;
      padding: 4px 14px;
      font-family: 'Arial Black', Arial, sans-serif;
      font-size: 22px;
      font-weight: 900;
      color: #fff;
      white-space: nowrap;
      letter-spacing: 0.5px;
    }

    .profile-pic {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 3px solid #fff;
      object-fit: cover;
      flex-shrink: 0;
    }

    .bar-row {
      flex: 0 0 36px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .milestone {
      color: #fff;
      font-family: 'Arial Black', Arial, sans-serif;
      font-size: 15px;
      font-weight: 900;
      min-width: 42px;
      text-align: center;
      flex-shrink: 0;
    }

    .bar-track {
      flex: 1;
      height: 36px;
      position: relative;
      overflow: hidden;
      border-radius: 3px;
    }

    .bar-track::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        90deg,
        #3a4d7c 0px, #3a4d7c 17px,
        #222c55 17px, #222c55 19px
      );
    }

    .bar-fill {
      position: absolute;
      inset: 0 auto 0 0;
      background: repeating-linear-gradient(
        90deg,
        #5ee8fc 0px, #5ee8fc 17px,
        #26c5dc 17px, #26c5dc 19px
      );
      transition: width 0.6s ease;
    }

    .info-row {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 2px 52px 0;
    }

    .date-text {
      color: #7aaeff;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.3;
      min-width: 40px;
    }

    .goal-text {
      flex: 1;
      text-align: center;
      font-family: 'Arial Black', Arial, sans-serif;
      font-size: 14px;
      font-weight: 900;
      color: #f0e040;
      letter-spacing: 0.5px;
    }

    .goal-text .num { font-size: 17px; }

    /* ════════════════════════════════════════
       CONTROL CONSOLE
    ════════════════════════════════════════ */
    .console {
      width: 1280px;
      margin-top: 8px;
      background: #1a2d52;
      border-radius: 10px;
      border: 2px solid #2e4a82;
      padding: 0 14px 12px;
    }

    .console-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #152340;
      border-radius: 8px 8px 0 0;
      margin: 0 -14px 10px;
      padding: 7px 14px;
      border-bottom: 1px solid #2e4a82;
    }

    .console-title {
      color: #5ee8fc;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.8px;
      text-transform: uppercase;
    }

    .console-tip {
      color: #7898c0;
      font-size: 10px;
      font-style: italic;
    }

    .console-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 8px 10px;
    }

    .field label {
      display: block;
      color: #90b8e8;
      font-size: 9.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 3px;
    }

    .field input {
      width: 100%;
      background: #0e1e3a;
      border: 1px solid #3a5898;
      border-radius: 4px;
      padding: 5px 8px;
      color: #d8eaff;
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s;
    }

    .field input:focus {
      border-color: #5ee8fc;
      background: #122040;
    }

    .field input::placeholder { color: #4a6890; }

    .field-span2 { grid-column: span 2; }

    /* Actions cell (bottom-right) */
    .actions-cell label { visibility: hidden; }

    .console-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 27px; /* match input height */
    }

    .btn-refresh {
      background: #1e3a78;
      border: 1px solid #5e88d8;
      border-radius: 4px;
      color: #c8e0ff;
      font-size: 11px;
      font-weight: 700;
      padding: 0 14px;
      height: 100%;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }

    .btn-refresh:hover  { background: #28408a; }
    .btn-refresh:active { background: #0e2048; }

    .status {
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .status.manual  { color: #7898c0; }
    .status.loading { color: #aaaaaa; }
    .status.live    { color: #40dd80; }
    .status.error   { color: #ee5040; }
  </style>
</head>
<body>

<!-- ── BAR ─────────────────────────────────────────────── -->
<div class="bar-container">
  <div class="indicator-row" id="indicatorRow">
    <div class="indicator" id="indicator">
      <div class="sub-count-box" id="subCountBox"></div>
      <img class="profile-pic" id="profilePic" src="" alt="streamer">
    </div>
  </div>

  <div class="bar-row">
    <span class="milestone" id="startLabel"></span>
    <div class="bar-track" id="barTrack">
      <div class="bar-fill" id="barFill" style="width:0"></div>
    </div>
    <span class="milestone" id="endLabel"></span>
  </div>

  <div class="info-row">
    <div class="date-text" id="dateText"></div>
    <div class="goal-text">
      <span class="num" id="subsNeeded"></span> more subs to <span id="nextMilestoneText"></span>!
    </div>
  </div>
</div>

<!-- ── CONTROL CONSOLE ───────────────────────────────────
     In OBS: alt-drag the BOTTOM edge of this browser source
     upward until the console disappears. The bar stays visible.
──────────────────────────────────────────────────────── -->
<div class="console">
  <div class="console-header">
    <span class="console-title">⚙ Control Console</span>
    <span class="console-tip">OBS tip: alt-drag the bottom edge of this source upward to hide this panel</span>
  </div>

  <div class="console-grid">

    <!-- Row 1 -->
    <div class="field">
      <label>Start Milestone</label>
      <input id="c-start" type="number" placeholder="300000">
    </div>
    <div class="field">
      <label>End Milestone</label>
      <input id="c-end" type="number" placeholder="400000">
    </div>
    <div class="field">
      <label>Next Goal</label>
      <input id="c-next" type="number" placeholder="325000">
    </div>
    <div class="field">
      <label>Current Subs (manual)</label>
      <input id="c-subs" type="number" placeholder="324582">
    </div>

    <!-- Row 2 -->
    <div class="field field-span2">
      <label>Profile Pic — local filename or full URL</label>
      <input id="c-pic" type="text" placeholder="profile.jpg  or  https://…">
    </div>
    <div class="field">
      <label>Date (shown bottom-left)</label>
      <input id="c-date" type="text" placeholder="08/10/2025">
    </div>
    <div class="field">
      <label>Auto-refresh (seconds)</label>
      <input id="c-refresh" type="number" placeholder="60" min="10">
    </div>

    <!-- Row 3 -->
    <div class="field field-span2">
      <label>YouTube Channel ID</label>
      <input id="c-channel" type="text" placeholder="UCxxxxxxxxxxxxxxxxxxxxx">
    </div>
    <div class="field">
      <label>YouTube API Key</label>
      <input id="c-apikey" type="password" placeholder="AIza…">
    </div>
    <div class="field actions-cell">
      <label>​</label>
      <div class="console-actions">
        <button class="btn-refresh" id="btnRefresh">↻ Refresh Now</button>
        <span class="status manual" id="statusBadge">● Manual</span>
      </div>
    </div>

  </div>
</div>

<script>
// ================================================================
//  DEFAULTS — shown on first load, then overridden by the console
// ================================================================
const DEFAULTS = {
  currentSubs:      324582,
  startMilestone:   300000,
  endMilestone:     400000,
  nextMilestone:    325000,
  profilePicUrl:    'profile.jpg',
  date:             '08/10/2025',
  youtubeChannelId: '',
  youtubeApiKey:    '',
  refreshSeconds:   60,
};

// Live CONFIG — loaded from localStorage, falls back to DEFAULTS
const CONFIG = Object.assign({}, DEFAULTS);

// ================================================================

const fmt  = n => Math.round(n).toLocaleString('en-US');
const fmtK = n => {
  if (n >= 1e6) return (n / 1e6) + 'M';
  if (n >= 1e3) return (n / 1e3) + 'K';
  return String(n);
};

// ── Persistence ─────────────────────────────────────────────────
function loadSaved() {
  try {
    const saved = JSON.parse(localStorage.getItem('subbar_config') || '{}');
    Object.assign(CONFIG, saved);
  } catch (e) { /* first run, nothing saved */ }
}

function saveConfig() {
  localStorage.setItem('subbar_config', JSON.stringify(CONFIG));
}

// ── Status badge ─────────────────────────────────────────────────
function setStatus(state, text) {
  const el = document.getElementById('statusBadge');
  if (!el) return;
  el.className = 'status ' + state;
  el.textContent = '● ' + text;
}

// ── Bar rendering ────────────────────────────────────────────────
function positionIndicator(pct) {
  const indicatorRow = document.getElementById('indicatorRow');
  const barTrack     = document.getElementById('barTrack');
  const indicator    = document.getElementById('indicator');

  const rowRect   = indicatorRow.getBoundingClientRect();
  const trackRect = barTrack.getBoundingClientRect();

  const trackLeftInRow = trackRect.left - rowRect.left;
  const fillEndX       = trackLeftInRow + trackRect.width * pct;
  const indW           = indicator.offsetWidth;

  let left = fillEndX - indW;
  left = Math.max(0, Math.min(left, rowRect.width - indW));
  indicator.style.left = left + 'px';
}

function updateUI(subs) {
  const { startMilestone, endMilestone, nextMilestone } = CONFIG;
  const pct = Math.max(0, Math.min(1,
    (subs - startMilestone) / (endMilestone - startMilestone)));

  document.getElementById('barFill').style.width           = (pct * 100) + '%';
  document.getElementById('subCountBox').textContent       = fmt(subs);
  document.getElementById('subsNeeded').textContent        = fmt(Math.max(0, nextMilestone - subs));
  document.getElementById('nextMilestoneText').textContent = fmt(nextMilestone);
  document.getElementById('startLabel').textContent        = fmtK(startMilestone);
  document.getElementById('endLabel').textContent          = fmtK(endMilestone);
  document.getElementById('profilePic').src                = CONFIG.profilePicUrl;

  const m = CONFIG.date.match(/^(\d{1,2}\/\d{1,2})\/?(\d{4})$/);
  document.getElementById('dateText').innerHTML = m ? `${m[1]}<br>${m[2]}` : CONFIG.date;

  requestAnimationFrame(() => positionIndicator(pct));
}

// ── YouTube API ──────────────────────────────────────────────────
async function fetchYouTubeSubs() {
  const { youtubeChannelId, youtubeApiKey } = CONFIG;
  try {
    const url  = `https://www.googleapis.com/youtube/v3/channels?part=statistics&id=${youtubeChannelId}&key=${youtubeApiKey}`;
    const res  = await fetch(url);
    const data = await res.json();
    return parseInt(data.items[0].statistics.subscriberCount, 10);
  } catch (e) {
    console.warn('YouTube fetch failed:', e);
    return null;
  }
}

let refreshTimer = null;

function startRefreshTimer() {
  if (refreshTimer) clearInterval(refreshTimer);
  if (CONFIG.youtubeChannelId && CONFIG.youtubeApiKey) {
    refreshTimer = setInterval(refresh, Math.max(10, CONFIG.refreshSeconds) * 1000);
  }
}

async function refresh() {
  let subs = CONFIG.currentSubs;
  if (CONFIG.youtubeChannelId && CONFIG.youtubeApiKey) {
    setStatus('loading', 'Fetching…');
    const live = await fetchYouTubeSubs();
    if (live !== null) {
      subs = live;
      setStatus('live', `Live · ${fmt(live)}`);
    } else {
      setStatus('error', 'API Error');
    }
  } else {
    setStatus('manual', 'Manual');
  }
  updateUI(subs);
}

// ── Console wiring ───────────────────────────────────────────────
function initConsole() {
  const bindings = [
    { id: 'c-start',   key: 'startMilestone',   parse: Number },
    { id: 'c-end',     key: 'endMilestone',     parse: Number },
    { id: 'c-next',    key: 'nextMilestone',    parse: Number },
    { id: 'c-subs',    key: 'currentSubs',      parse: Number },
    { id: 'c-pic',     key: 'profilePicUrl',    parse: String },
    { id: 'c-date',    key: 'date',             parse: String },
    { id: 'c-refresh', key: 'refreshSeconds',   parse: Number },
    { id: 'c-channel', key: 'youtubeChannelId', parse: String },
    { id: 'c-apikey',  key: 'youtubeApiKey',    parse: String },
  ];

  for (const { id, key, parse } of bindings) {
    const el = document.getElementById(id);
    if (!el) continue;
    el.value = CONFIG[key];                       // populate from loaded config
    el.addEventListener('input', () => {
      const raw = el.value.trim();
      if (raw !== '') CONFIG[key] = parse(raw);
      saveConfig();
      startRefreshTimer();                        // restart timer if interval changed
      refresh();
    });
  }

  document.getElementById('btnRefresh')?.addEventListener('click', refresh);
}

// ── Boot ─────────────────────────────────────────────────────────
window.addEventListener('load', () => {
  loadSaved();
  initConsole();
  refresh();
  startRefreshTimer();
});
</script>
</body>
</html>
