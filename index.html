<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="dark">
  <title>Sub Bar Overlay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { background: #0a1020; }

    body {
      width: 1280px;
      background: transparent;
      -webkit-font-smoothing: antialiased;
      font-family: Arial, sans-serif;
    }

    /* ════════════════════════════════════════
       BAR
    ════════════════════════════════════════ */
    .bar-container {
      width: 1280px;
      height: 110px;
      background: #2d3f6e;
      border-radius: 10px;
      padding: 0 14px 4px;
      display: flex;
      flex-direction: column;
    }

    .indicator-row { flex: 0 0 48px; position: relative; }

    .indicator {
      position: absolute;
      bottom: 2px;
      display: flex;
      align-items: flex-end;
      gap: 6px;
    }

    .sub-count-box {
      background: #182848;
      border: 2.5px solid #5888ee;
      border-radius: 7px;
      padding: 4px 14px;
      font-family: 'Arial Black', Arial, sans-serif;
      font-size: 22px;
      font-weight: 900;
      color: #fff;
      white-space: nowrap;
      letter-spacing: 0.5px;
    }

    .profile-pic {
      width: 46px; height: 46px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }

    .bar-row {
      flex: 0 0 36px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .milestone {
      color: #fff;
      font-family: 'Arial Black', Arial, sans-serif;
      font-size: 15px;
      font-weight: 900;
      min-width: 42px;
      text-align: center;
      flex-shrink: 0;
    }

    .bar-track {
      flex: 1;
      height: 36px;
      position: relative;
      overflow: hidden;
      border-radius: 3px;
    }

    .bar-track::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        90deg,
        #3a4d7c 0px, #3a4d7c 17px,
        #222c55 17px, #222c55 19px
      );
    }

    .bar-fill {
      position: absolute;
      inset: 0 auto 0 0;
      background: repeating-linear-gradient(
        90deg,
        #5ee8fc 0px, #5ee8fc 17px,
        #26c5dc 17px, #26c5dc 19px
      );
      transition: width 0.6s ease;
    }

    .info-row {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 2px 52px 0;
    }

    .goal-text {
      flex: 1;
      text-align: center;
      font-family: 'Arial Black', Arial, sans-serif;
      font-size: 14px;
      font-weight: 900;
      color: #f0e040;
      letter-spacing: 0.5px;
    }

    .goal-text .num { font-size: 17px; }

    /* ════════════════════════════════════════
       CONTROL CONSOLE
    ════════════════════════════════════════ */
    .console {
      width: 1280px;
      margin-top: 40px;
      background: #1a2d52;
      border-radius: 10px;
      border: 2px solid #2e4a82;
      padding: 0 14px 14px;
    }

    .console-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #152340;
      border-radius: 8px 8px 0 0;
      margin: 0 -14px 10px;
      padding: 7px 14px;
      border-bottom: 1px solid #2e4a82;
    }

    .console-title {
      color: #5ee8fc;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.8px;
      text-transform: uppercase;
    }

    .console-tip {
      color: #7898c0;
      font-size: 10px;
      font-style: italic;
    }

    .console-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 8px 10px;
    }

    .field label {
      display: block;
      color: #90b8e8;
      font-size: 9.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 3px;
    }

    .field input {
      width: 100%;
      background: #0e1e3a;
      border: 1px solid #3a5898;
      border-radius: 4px;
      padding: 5px 8px;
      color: #d8eaff;
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s;
    }

    .field input:focus {
      border-color: #5ee8fc;
      background: #122040;
    }

    .field input::placeholder { color: #4a6890; }

    .field-span2 { grid-column: span 2; }

    /* Actions cells */
    .actions-cell label { visibility: hidden; }

    .console-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 27px;
    }

    .btn-action {
      background: #1e3a78;
      border: 1px solid #5e88d8;
      border-radius: 4px;
      color: #c8e0ff;
      font-size: 11px;
      font-weight: 700;
      padding: 0 12px;
      height: 100%;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
      flex-shrink: 0;
    }

    .btn-action:hover  { background: #28408a; }
    .btn-action:active { background: #0e2048; }

    .btn-action.btn-disconnect {
      background: #4a1a1a;
      border-color: #985050;
      color: #e8a0a0;
    }

    .status {
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .status.manual   { color: #7898c0; }
    .status.loading  { color: #aaaaaa; }
    .status.live     { color: #40dd80; }
    .status.error    { color: #ee5040; }
    .status.auth-off { color: #607090; }
    .status.auth-on  { color: #40dd80; }

    /* Divider between API-key row and OAuth row */
    .console-divider {
      grid-column: span 4;
      border: none;
      border-top: 1px solid #243a68;
      margin: 2px 0;
    }

    .field-span3 { grid-column: span 3; }
    .field-span4 { grid-column: span 4; }
  </style>
</head>
<body>

<!-- ── BAR ─────────────────────────────────────────────── -->
<div class="bar-container">
  <div class="indicator-row" id="indicatorRow">
    <div class="indicator" id="indicator">
      <div class="sub-count-box" id="subCountBox"></div>
      <img class="profile-pic" id="profilePic" src="" alt="streamer">
    </div>
  </div>

  <div class="bar-row">
    <span class="milestone" id="startLabel"></span>
    <div class="bar-track" id="barTrack">
      <div class="bar-fill" id="barFill" style="width:0"></div>
    </div>
    <span class="milestone" id="endLabel"></span>
  </div>

  <div class="info-row">
    <div class="goal-text">
      <span class="num" id="subsNeeded"></span> more subs to <span id="nextMilestoneText"></span>!
    </div>
  </div>
</div>

<!-- ── CONTROL CONSOLE ────────────────────────────────────
     OBS: alt-drag the bottom edge of this source upward
     to crop out this panel. The bar stays visible.
──────────────────────────────────────────────────────── -->
<div class="console">
  <div class="console-header">
    <span class="console-title">⚙ Control Console</span>
    <span class="console-tip">OBS tip: alt-drag the bottom edge of this source upward to hide this panel</span>
  </div>

  <div class="console-grid">

    <!-- Row 1: milestones + manual count -->
    <div class="field">
      <label>Start Milestone</label>
      <input id="c-start" type="number" placeholder="300000">
    </div>
    <div class="field">
      <label>End Milestone</label>
      <input id="c-end" type="number" placeholder="400000">
    </div>
    <div class="field">
      <label>Next Goal</label>
      <input id="c-next" type="number" placeholder="325000">
    </div>
    <div class="field">
      <label>Current Subs (manual)</label>
      <input id="c-subs" type="number" placeholder="34686">
    </div>

    <!-- Row 2: visual settings + actions -->
    <div class="field field-span2">
      <label>Profile Pic — local filename or full URL</label>
      <input id="c-pic" type="text" placeholder="profile.jpg  or  https://…">
    </div>
    <div class="field">
      <label>Auto-refresh (seconds)</label>
      <input id="c-refresh" type="number" placeholder="60" min="10">
    </div>
    <div class="field actions-cell">
      <label>​</label>
      <div class="console-actions">
        <button class="btn-action" id="btnRefresh">↻ Refresh</button>
        <span class="status manual" id="statusBadge">● Manual</span>
      </div>
    </div>

    <hr class="console-divider">

    <!-- Row 6: StreamElements JWT (exact count) -->
    <div class="field field-span3">
      <label>StreamElements JWT — EXACT count (streamelements.com → profile → Show Secrets)</label>
      <input id="c-se-jwt" type="password" placeholder="eyJ…">
    </div>
    <div class="field actions-cell">
      <label>​</label>
      <div class="console-actions">
        <button class="btn-action btn-disconnect" id="btnClearSE">✕ Clear</button>
        <span class="status auth-off" id="seBadge">● Not connected</span>
      </div>
    </div>

  </div>

</div>

<script>
// ================================================================
//  DEFAULTS — first-run values; overridden by console / localStorage
// ================================================================
const DEFAULTS = {
  currentSubs:      34686,       // Manual sub count (exact fallback)
  startMilestone:   30000,       // Left end of bar
  endMilestone:     40000,       // Right end of bar
  nextMilestone:    35000,       // Next milestone to reach
  profilePicUrl:    'profile.jpg', // Local filename or URL
  streamElementsJwt: '',          // StreamElements JWT — gives exact count
  refreshSeconds:   60,           // How often to poll YouTube
};

const CONFIG = Object.assign({}, DEFAULTS);

// ================================================================

const fmt  = n => Math.round(n).toLocaleString('en-US');
const fmtK = n => {
  if (n >= 1e6) return (n / 1e6) + 'M';
  if (n >= 1e3) return (n / 1e3) + 'K';
  return String(n);
};

function nextRoundNumber(n) {
  let step;
  if      (n <    10000) step =   500;
  else if (n <   100000) step =  1000;
  else if (n <  1000000) step =  5000;
  else                   step = 50000;
  return Math.ceil((n + 1) / step) * step;
}

// ── Persistence ──────────────────────────────────────────────────
function loadSaved() {
  try {
    Object.assign(CONFIG, JSON.parse(localStorage.getItem('subbar_config') || '{}'));
  } catch (e) { /* first run */ }
}

function saveConfig() {
  localStorage.setItem('subbar_config', JSON.stringify(CONFIG));
}

// ── Status / auth badges ─────────────────────────────────────────
function setStatus(state, text) {
  const el = document.getElementById('statusBadge');
  if (el) { el.className = 'status ' + state; el.textContent = '● ' + text; }
}

function setSeBadge(state) {
  const el = document.getElementById('seBadge');
  if (!el) return;
  el.className   = 'status ' + state;
  el.textContent = state === 'auth-on' ? '● Connected ✓' : '● Not connected';
}

// ── Bar rendering ────────────────────────────────────────────────
function positionIndicator(pct) {
  const row   = document.getElementById('indicatorRow');
  const track = document.getElementById('barTrack');
  const ind   = document.getElementById('indicator');
  const rR    = row.getBoundingClientRect();
  const tR    = track.getBoundingClientRect();
  const fillEndX = (tR.left - rR.left) + tR.width * pct;
  let left = fillEndX - ind.offsetWidth;
  left = Math.max(0, Math.min(left, rR.width - ind.offsetWidth));
  ind.style.left = left + 'px';
}

function updateUI(subs) {
  if (subs >= CONFIG.nextMilestone) {
    CONFIG.nextMilestone = nextRoundNumber(subs);
    saveConfig();
    const el = document.getElementById('c-next');
    if (el) el.value = CONFIG.nextMilestone;
  }

  const { startMilestone, endMilestone, nextMilestone } = CONFIG;
  const pct = Math.max(0, Math.min(1,
    (subs - startMilestone) / (endMilestone - startMilestone)));

  document.getElementById('barFill').style.width           = (pct * 100) + '%';
  document.getElementById('subCountBox').textContent       = fmt(subs);
  document.getElementById('subsNeeded').textContent        = fmt(Math.max(0, nextMilestone - subs));
  document.getElementById('nextMilestoneText').textContent = fmt(nextMilestone);
  document.getElementById('startLabel').textContent        = fmtK(startMilestone);
  document.getElementById('endLabel').textContent          = fmtK(endMilestone);
  document.getElementById('profilePic').src                = CONFIG.profilePicUrl;

  requestAnimationFrame(() => positionIndicator(pct));
}

// ── StreamElements fetch (exact count) ───────────────────────────
async function fetchStreamElementsSubs() {
  if (!CONFIG.streamElementsJwt) return null;
  try {
    const res = await fetch('https://api.streamelements.com/kappa/v2/channels/me', {
      headers: { Authorization: `Bearer ${CONFIG.streamElementsJwt}` }
    });
    const data = await res.json();
    if (!res.ok) {
      console.warn('StreamElements error', res.status, data?.message);
      setSeBadge('auth-off');
      return null;
    }
    const count = data?.providerTotals?.['subscriber-total'];
    if (count != null) { setSeBadge('auth-on'); return parseInt(count, 10); }
    console.warn('StreamElements: subscriber-total not found in providerTotals');
    setSeBadge('auth-off');
    return null;
  } catch (e) {
    console.warn('StreamElements fetch failed:', e);
    setSeBadge('auth-off');
    return null;
  }
}

let refreshTimer = null;

function startRefreshTimer() {
  if (refreshTimer) clearInterval(refreshTimer);
  if (CONFIG.streamElementsJwt) {
    refreshTimer = setInterval(refresh, Math.max(10, CONFIG.refreshSeconds) * 1000);
  }
}

async function refresh() {
  let subs = CONFIG.currentSubs;

  if (CONFIG.streamElementsJwt) {
    setStatus('loading', 'Fetching…');
    const live = await fetchStreamElementsSubs();
    if (live !== null) {
      subs = live;
      CONFIG.currentSubs = subs;
      saveConfig();
      const el = document.getElementById('c-subs');
      if (el) el.value = subs;
      setStatus('live', `Live · ${fmt(subs)}`);
    } else {
      setStatus('error', 'Fetch Error');
    }
  } else {
    setStatus('manual', 'Manual');
  }
  updateUI(subs);
}

// ── Console wiring ───────────────────────────────────────────────
function initConsole() {
  const bindings = [
    { id: 'c-start',   key: 'startMilestone', parse: Number },
    { id: 'c-end',     key: 'endMilestone',   parse: Number },
    { id: 'c-next',    key: 'nextMilestone',  parse: Number },
    { id: 'c-subs',    key: 'currentSubs',    parse: Number },
    { id: 'c-pic',     key: 'profilePicUrl',  parse: String },
    { id: 'c-refresh', key: 'refreshSeconds', parse: Number },
  ];

  for (const { id, key, parse } of bindings) {
    const el = document.getElementById(id);
    if (!el) continue;
    el.value = CONFIG[key];
    el.addEventListener('input', () => {
      const raw = el.value.trim();
      if (raw !== '') CONFIG[key] = parse(raw);
      saveConfig();
      startRefreshTimer();
      refresh();
    });
  }

  document.getElementById('btnRefresh')?.addEventListener('click', refresh);

  // StreamElements JWT
  const seEl = document.getElementById('c-se-jwt');
  if (seEl) {
    seEl.value = CONFIG.streamElementsJwt;
    seEl.addEventListener('input', () => {
      CONFIG.streamElementsJwt = seEl.value.trim();
      saveConfig();
      setSeBadge(CONFIG.streamElementsJwt ? 'auth-on' : 'auth-off');
      startRefreshTimer();
      refresh();
    });
  }

  document.getElementById('btnClearSE')?.addEventListener('click', () => {
    CONFIG.streamElementsJwt = '';
    saveConfig();
    if (seEl) seEl.value = '';
    setSeBadge('auth-off');
    startRefreshTimer();
    refresh();
  });

  if (CONFIG.streamElementsJwt) setSeBadge('auth-on');
}

// ── Boot ─────────────────────────────────────────────────────────
window.addEventListener('load', () => {
  loadSaved();
  initConsole();
  refresh();
  startRefreshTimer();
});
</script>
</body>
</html>
