<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Sub Bar Overlay</title>
  <style>
    @font-face {
      font-family: 'Eurostile';
      src: url('Eurostile BoldItalic.ttf') format('truetype');
      font-weight: bold;
      font-style: italic;
    }

    @font-face {
      font-family: 'Third Rail';
      src: url('Third Rail.ttf') format('truetype');
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { background: #0a1020; }

    body {
      width: 1280px;
      background: transparent;
      -webkit-font-smoothing: antialiased;
      font-family: Arial, sans-serif;
    }

    /* ════════════════════════════════════════
       BAR — BG.png is the pill; Loader.webm animates the full progress
       internally. We seek the video's currentTime to the frame that
       matches (currentSubs − start) / (end − start), and pause it
       there so it stays visible.
    ════════════════════════════════════════ */
    .bar-container {
      position: relative;
      width: 1280px;
    }

    .bar-bg {
      display: block;
      width: 100%;
      height: auto;
    }

    .bar-loader {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
    }
    /* Hidden video element used only to decode Loader.webm; the
       visible bar is the canvas, because OBS CEF refuses to repaint
       a paused <video> tag. */
    .bar-loader-src {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    /* ── Notification row ─────────────────── */
    .notif-row {
      width: 1280px;
      height: 38px;
      margin-top: -50px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      overflow: hidden;
    }

    .notif-text {
      font-family: 'Eurostile', 'Arial Black', sans-serif;
      font-weight: bold;
      font-style: italic;
      font-size: 22px;
      color: #fff;
      text-shadow: 0 1px 6px rgba(0,0,0,0.9), 0 0 22px rgba(94,232,252,0.45);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.4s ease, transform 0.4s ease;
      white-space: nowrap;
    }

    .notif-text.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ── Combo row ────────────────────────────── */
    .combo-row {
      width: 1280px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      overflow: hidden;
    }

    .combo-text {
      font-family: 'Eurostile', 'Arial Black', sans-serif;
      font-weight: bold;
      font-style: italic;
      color: #e0f0ff;
      font-size: 26px;
      text-shadow: 0 1px 6px rgba(0,0,0,0.9), 0 0 18px rgba(94,232,252,0.5);
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.3s ease, font-size 0.15s ease, color 0.15s ease, text-shadow 0.15s ease;
    }

    .combo-text.visible { opacity: 1; }

    /* x5 – x9: gold */
    .combo-text.hot {
      color: #ffd060;
      font-size: 32px;
      text-shadow: 0 1px 6px rgba(0,0,0,0.9), 0 0 28px rgba(255,200,0,0.85);
    }

    /* x10+: fire */
    .combo-text.fire {
      color: #ff7040;
      font-size: 40px;
      text-shadow: 0 1px 6px rgba(0,0,0,0.9),
                   0 0 30px rgba(255,100,0,0.9),
                   0 0 60px rgba(255,40,0,0.55);
    }

    @keyframes combo-bump {
      0%   { transform: scale(1); }
      45%  { transform: scale(1.22); }
      100% { transform: scale(1); }
    }
    .combo-text.bump { animation: combo-bump 0.28s ease; }

    /* BG.png bar strip ends at ~117px at 1280px display width.
       Milestones sit 5px below that, inside bar-container. */
    .milestone {
      position: absolute;
      top: 147px;
      color: #fff;
      font-family: 'Third Rail', 'Arial Black', sans-serif;
      font-size: 20px;
      white-space: nowrap;
      text-shadow: 0 1px 4px rgba(0,0,0,0.7);
      pointer-events: none;
      z-index: 3;
    }

    .milestone-start { left: 24px; }
    .milestone-end   { right: 24px; }

    /* ════════════════════════════════════════
       CONTROL CONSOLE
    ════════════════════════════════════════ */
    .console {
      width: 1280px;
      margin-top: 40px;
      background: #1a2d52;
      border-radius: 10px;
      border: 2px solid #2e4a82;
      padding: 0 14px 14px;
    }

    .console-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #152340;
      border-radius: 8px 8px 0 0;
      margin: 0 -14px 10px;
      padding: 7px 14px;
      border-bottom: 1px solid #2e4a82;
    }

    .console-title {
      color: #5ee8fc;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.8px;
      text-transform: uppercase;
    }

    .console-tip {
      color: #7898c0;
      font-size: 10px;
      font-style: italic;
    }

    .console-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 8px 10px;
    }

    .field label {
      display: block;
      color: #90b8e8;
      font-size: 9.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 3px;
    }

    .field input {
      width: 100%;
      background: #0e1e3a;
      border: 1px solid #3a5898;
      border-radius: 4px;
      padding: 5px 8px;
      color: #d8eaff;
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s;
    }

    .field input:focus {
      border-color: #5ee8fc;
      background: #122040;
    }

    .field input::placeholder { color: #4a6890; }

    /* colour field: swatch + hex text side by side */
    .color-field-wrap {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .color-swatch {
      width: 27px;
      height: 27px;
      border-radius: 4px;
      border: 1px solid #3a5898;
      flex-shrink: 0;
      cursor: default;
    }

    .color-hex {
      flex: 1;
      background: #0e1e3a;
      border: 1px solid #3a5898;
      border-radius: 4px;
      padding: 5px 8px;
      color: #d8eaff;
      font-size: 12px;
      outline: none;
      font-family: monospace;
      transition: border-color 0.15s;
    }

    .color-hex:focus { border-color: #5ee8fc; background: #122040; }

    .hex-prefix {
      color: #6a88b4;
      font-family: monospace;
      font-size: 12px;
      user-select: none;
      margin-right: -2px;
    }

    .field-span2 { grid-column: span 2; }

    /* Actions cells */
    .actions-cell label { visibility: hidden; }

    .console-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 27px;
    }

    .btn-action {
      background: #1e3a78;
      border: 1px solid #5e88d8;
      border-radius: 4px;
      color: #c8e0ff;
      font-size: 11px;
      font-weight: 700;
      padding: 0 12px;
      height: 100%;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
      flex-shrink: 0;
    }

    .btn-action:hover  { background: #28408a; }
    .btn-action:active { background: #0e2048; }

    .btn-action.btn-disconnect {
      background: #4a1a1a;
      border-color: #985050;
      color: #e8a0a0;
    }

    .status {
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .status.manual   { color: #7898c0; }
    .status.loading  { color: #aaaaaa; }
    .status.live     { color: #40dd80; }
    .status.error    { color: #ee5040; }
    .status.auth-off { color: #607090; }
    .status.auth-on  { color: #40dd80; }

    /* Divider between API-key row and OAuth row */
    .console-divider {
      grid-column: span 4;
      border: none;
      border-top: 1px solid #243a68;
      margin: 2px 0;
    }

    .field-span3 { grid-column: span 3; }
    .field-span4 { grid-column: span 4; }

  </style>
</head>
<body>

<!-- ── BAR ─────────────────────────────────────────────── -->
<div class="bar-container">
  <img class="bar-bg" src="BG.png" alt="">
  <canvas class="bar-loader" id="barCanvas"></canvas>
  <video class="bar-loader-src" id="barLoader" muted playsinline preload="auto">
    <source src="Loader.webm" type="video/webm">
  </video>
  <span class="milestone milestone-start" id="startLabel"></span>
  <span class="milestone milestone-end" id="endLabel"></span>
</div>

<!-- ── NOTIFICATIONS ──────────────────────────────────────── -->
<div class="notif-row">
  <span class="notif-text" id="notifText"></span>
</div>

<!-- ── COMBO ──────────────────────────────────────────────── -->
<div class="combo-row">
  <span class="combo-text" id="comboText"></span>
</div>

<!-- ── CONTROL CONSOLE ────────────────────────────────────
     OBS: alt-drag the bottom edge of this source upward
     to crop out this panel. The bar stays visible.
──────────────────────────────────────────────────────── -->
<div class="console">
  <div class="console-header">
    <span class="console-title">⚙ Control Console</span>
    <span class="console-tip">OBS tip: alt-drag the bottom edge of this source upward to hide this panel</span>
    <button class="btn-action" id="btnTestNotif" style="margin-left:16px;white-space:nowrap;flex-shrink:0;">🔔 Test Notification</button>
    <button class="btn-action" id="btnTestCombo" style="margin-left:8px;white-space:nowrap;flex-shrink:0;">⚡ Test Combo</button>
  </div>

  <div class="console-grid">

    <!-- Row 1: milestones + colours -->
    <div class="field">
      <label>Start Milestone</label>
      <input id="c-start" type="number" placeholder="30000">
    </div>
    <div class="field">
      <label>End Milestone</label>
      <input id="c-end" type="number" placeholder="40000">
    </div>
    <div class="field">
      <label>Next Goal</label>
      <input id="c-next" type="number" placeholder="35000">
    </div>

    <!-- StreamElements JWT (preferred) -->
    <div class="field field-span4">
      <label>StreamElements JWT — streamelements.com → Account → Show Secrets → JWT Token &nbsp;<span id="se-status" class="status auth-off">● disconnected</span></label>
      <input id="c-se-jwt" type="password" placeholder="eyJhbGci…">
    </div>

    <!-- YouTube API (fallback if no SE JWT) -->
    <div class="field field-span3">
      <label>YouTube API Key (fallback) — console.cloud.google.com → Enable "YouTube Data API v3" → Credentials → API Key</label>
      <input id="c-yt-key" type="password" placeholder="AIzaSy…">
    </div>
    <div class="field">
      <label>YouTube Channel ID</label>
      <input id="c-yt-channel" type="text" placeholder="UCxxxxxxxxxxxxxxxx">
    </div>

    <!-- Actions -->
    <div class="field">
      <label>Static Sub Count</label>
      <input id="c-static-subs" type="number" placeholder="0">
    </div>
    <div class="field">
      <label>Auto-refresh (seconds)</label>
      <input id="c-refresh" type="number" placeholder="60" min="10">
    </div>
    <div class="field actions-cell field-span2">
      <label>​</label>
      <div class="console-actions">
        <button class="btn-action" id="btnRefresh">↻ Refresh</button>
        <button class="btn-action" id="btnDebug">🔍 Debug Loader</button>
      </div>
    </div>

  </div>

</div>

<script>
// ================================================================
//  DEFAULTS — first-run values; overridden by console / localStorage
// ================================================================
const DEFAULTS = {
  startMilestone:  30000,         // Left end of bar
  endMilestone:    40000,         // Right end of bar
  nextMilestone:   35000,         // Next milestone label
  seJwt:           '',            // SE JWT — primary count source (works for YT-linked accounts)
  youtubeApiKey:   '',            // YouTube Data API key — fallback if no SE JWT
  youtubeChannelId: '',           // YouTube channel ID (UCxxxxxxx)
  refreshSeconds:  600,           // Auto-refresh interval (seconds)
  staticSubCount:  0,             // Manual override if APIs unavailable
};

const CONFIG = Object.assign({}, DEFAULTS);

// ================================================================

const fmtK = n => {
  if (n >= 1e6) return (n / 1e6) + 'M';
  if (n >= 1e3) return (n / 1e3) + 'K';
  return String(n);
};

// ── Persistence ──────────────────────────────────────────────────
function loadSaved() {
  try {
    Object.assign(CONFIG, JSON.parse(localStorage.getItem('subbar_config') || '{}'));
  } catch (e) { /* first run */ }
}

function saveConfig() {
  localStorage.setItem('subbar_config', JSON.stringify(CONFIG));
}

// ── StreamElements API ───────────────────────────────────────────
// Works for both YouTube and Twitch-linked SE accounts.
// YouTube accounts: data.subscribers holds the count.
async function fetchSECount() {
  if (!CONFIG.seJwt) return null;
  try {
    const res = await fetch('https://api.streamelements.com/kappa/v2/channels/me', {
      headers: { 'Authorization': 'Bearer ' + CONFIG.seJwt }
    });
    if (!res.ok) return null;
    const data = await res.json();
    const count = data?.subscribers ?? data?.followers ?? null;
    return count != null ? parseInt(count, 10) : null;
  } catch (e) { return null; }
}

// ── YouTube Data API ─────────────────────────────────────────────
// Free API key: console.cloud.google.com → New project → Library →
// "YouTube Data API v3" → Enable → Credentials → Create API Key.
async function fetchYouTubeSubs() {
  if (!CONFIG.youtubeApiKey || !CONFIG.youtubeChannelId) return null;
  try {
    const url = `https://www.googleapis.com/youtube/v3/channels`
              + `?part=statistics&id=${encodeURIComponent(CONFIG.youtubeChannelId)}`
              + `&key=${encodeURIComponent(CONFIG.youtubeApiKey)}`;
    const res = await fetch(url);
    if (!res.ok) return null;
    const data = await res.json();
    const count = data?.items?.[0]?.statistics?.subscriberCount;
    return count != null ? parseInt(count, 10) : null;
  } catch (e) { return null; }
}

// ── Bar rendering ────────────────────────────────────────────────
// OBS CEF can't seek a webm to a non-keyframe — every seek lands on
// the previous keyframe (often frame 1). To land on the right frame
// reliably we play the hidden video forward, copy each frame to the
// canvas, and pause once we cross the target time.
function seekLoader(pct) {
  const video  = document.getElementById('barLoader');
  const canvas = document.getElementById('barCanvas');
  if (!video || !canvas) return;
  const targetPct = Math.max(0, Math.min(1, pct / 100));

  const draw = () => {
    if (!video.videoWidth || !video.videoHeight) return;
    if (canvas.width  !== video.videoWidth)  canvas.width  = video.videoWidth;
    if (canvas.height !== video.videoHeight) canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    try { ctx.drawImage(video, 0, 0, canvas.width, canvas.height); } catch (e) {}
  };

  // Cancel any in-progress drive from a previous refresh
  if (video._cleanup) { video._cleanup(); video._cleanup = null; }

  const apply = () => {
    if (!isFinite(video.duration) || video.duration <= 0) return;
    const target = targetPct * video.duration;

    if (target <= 0) {
      video.pause();
      video.currentTime = 0;
      const ctx = canvas.getContext('2d');
      if (canvas.width && canvas.height) ctx.clearRect(0, 0, canvas.width, canvas.height);
      return;
    }

    let stopped = false;
    let rafId   = 0;
    const tick = () => {
      if (stopped) return;
      draw();
      if (video.currentTime >= target) {
        stopped = true;
        video.pause();
        draw();
        return;
      }
      rafId = requestAnimationFrame(tick);
    };
    video._cleanup = () => {
      stopped = true;
      if (rafId) cancelAnimationFrame(rafId);
      video.pause();
    };

    video.pause();
    video.currentTime = 0;
    const startPlay = () => {
      video.removeEventListener('seeked', startPlay);
      const p = video.play();
      if (p && p.catch) p.catch(() => {});
      rafId = requestAnimationFrame(tick);
    };
    video.addEventListener('seeked', startPlay, { once: true });
    // Some CEF builds skip the seeked event when already at 0; nudge after a tick.
    setTimeout(() => {
      if (!stopped && video.currentTime === 0) startPlay();
    }, 50);
  };

  if (video.readyState >= 2) apply();
  else video.addEventListener('loadeddata', apply, { once: true });
}

function updateUI(fillPct) {
  const pct = Math.max(0, Math.min(100, fillPct));
  seekLoader(pct);
  document.getElementById('startLabel').textContent = fmtK(CONFIG.startMilestone);
  document.getElementById('endLabel').textContent   = fmtK(CONFIG.endMilestone);
}

let refreshTimer = null;

function startRefreshTimer() {
  if (refreshTimer) clearInterval(refreshTimer);
  // Hard floor of 600 s (10 min) regardless of saved config — the
  // loader webm animates on every refresh so more frequent updates
  // become visually distracting.
  const seconds = Math.max(600, CONFIG.refreshSeconds || 0);
  refreshTimer = setInterval(refresh, seconds * 1000);
}

async function refresh() {
  let count = await fetchSECount();
  if (count == null) count = await fetchYouTubeSubs();
  if (count == null && CONFIG.staticSubCount > 0) count = CONFIG.staticSubCount;
  if (count == null) { updateUI(0); return; }
  const fillPct = (count - CONFIG.startMilestone)
                / (CONFIG.endMilestone - CONFIG.startMilestone) * 100;
  updateUI(fillPct);
}

// ── Console wiring ───────────────────────────────────────────────
function initConsole() {
  const bindings = [
    { id: 'c-start',       key: 'startMilestone',   parse: Number },
    { id: 'c-end',         key: 'endMilestone',     parse: Number },
    { id: 'c-next',        key: 'nextMilestone',    parse: Number },
    { id: 'c-refresh',     key: 'refreshSeconds',   parse: Number },
    { id: 'c-se-jwt',      key: 'seJwt',            parse: String },
    { id: 'c-yt-key',      key: 'youtubeApiKey',    parse: String },
    { id: 'c-yt-channel',  key: 'youtubeChannelId', parse: String },
  ];

  for (const { id, key, parse } of bindings) {
    const el = document.getElementById(id);
    if (!el) continue;
    el.value = CONFIG[key];
    el.addEventListener('input', () => {
      const raw = el.value.trim();
      if (raw !== '') CONFIG[key] = parse(raw);
      saveConfig();
      refresh();
      if (key === 'seJwt') connectSESocket();
    });
  }

  const staticSubEl = document.getElementById('c-static-subs');
  if (staticSubEl) {
    staticSubEl.value = CONFIG.staticSubCount || '';
    staticSubEl.addEventListener('input', () => {
      const raw = staticSubEl.value.trim();
      CONFIG.staticSubCount = raw !== '' ? Number(raw) : 0;
      saveConfig();
      refresh();
    });
  }

  function wireColorField(inputId, swatchId, configKey, applyFn) {
    const el     = document.getElementById(inputId);
    const swatch = document.getElementById(swatchId);
    if (!el) return;
    // show stored value without the leading #
    el.value = (CONFIG[configKey] || '').replace(/^#/, '');
    if (swatch) swatch.style.background = CONFIG[configKey];
    el.addEventListener('input', () => {
      const raw = el.value.trim().replace(/^#/, '');
      if (!/^[0-9a-fA-F]{6}$/.test(raw)) return;
      const hex = '#' + raw.toLowerCase();
      CONFIG[configKey] = hex;
      if (swatch) swatch.style.background = hex;
      saveConfig();
      applyFn(hex);
    });
  }

  document.getElementById('btnRefresh')?.addEventListener('click', refresh);

  document.getElementById('btnDebug')?.addEventListener('click', () => {
    const video  = document.getElementById('barLoader');
    const canvas = document.getElementById('barCanvas');
    const info = [
      `readyState: ${video.readyState} (0=nothing,1=meta,2=cur,3=future,4=enough)`,
      `duration: ${video.duration}`,
      `videoWidth x videoHeight: ${video.videoWidth} x ${video.videoHeight}`,
      `currentTime: ${video.currentTime}`,
      `canvas: ${canvas.width} x ${canvas.height}`,
      `networkState: ${video.networkState} (0=empty,1=idle,2=loading,3=no-source)`,
      `error: ${video.error ? video.error.message : 'none'}`,
      `fillPct config: start=${CONFIG.startMilestone} end=${CONFIG.endMilestone} static=${CONFIG.staticSubCount}`,
    ];
    alert(info.join('\n'));
  });

  document.getElementById('btnTestCombo')?.addEventListener('click', () => addToCombo(1));

  const testMessages = [
    'RoryPlays has just subscribed!',
    'xXSniper99Xx has been a member for 6 months!',
    'GiftKing gifted a membership to LuckyViewer!',
    'MegaFan gifted 5 memberships to the community!',
  ];
  let testIdx = 0;
  document.getElementById('btnTestNotif')?.addEventListener('click', () => {
    showNotif(testMessages[testIdx % testMessages.length]);
    testIdx++;
  });
}

// ── Notification queue ───────────────────────────────────────────
const notifQueue = [];
let notifBusy = false;

function showNotif(msg) {
  notifQueue.push(msg);
  if (!notifBusy) drainNotifQueue();
}

function drainNotifQueue() {
  if (!notifQueue.length) { notifBusy = false; return; }
  notifBusy = true;
  const el = document.getElementById('notifText');
  el.textContent = notifQueue.shift();
  el.classList.add('visible');
  setTimeout(() => {
    el.classList.remove('visible');
    setTimeout(drainNotifQueue, 450); // wait for fade-out
  }, 4500);
}

// ── Sub combo ────────────────────────────────────────────────────
let comboCount = 0;
let comboTimer = null;
const COMBO_RESET_MS = 7000;

function addToCombo(n) {
  comboCount += n;
  if (comboTimer) clearTimeout(comboTimer);
  comboTimer = setTimeout(resetCombo, COMBO_RESET_MS);
  updateComboDisplay();
}

function updateComboDisplay() {
  if (comboCount < 2) return;
  const el = document.getElementById('comboText');
  if (!el) return;
  el.textContent = `×${comboCount} SUB COMBO!`;
  el.classList.remove('hot', 'fire');
  if      (comboCount >= 10) el.classList.add('fire');
  else if (comboCount >= 5)  el.classList.add('hot');
  el.classList.add('visible');
  // bump animation: remove then re-add to retrigger
  el.classList.remove('bump');
  requestAnimationFrame(() => el.classList.add('bump'));
}

function resetCombo() {
  comboCount = 0;
  comboTimer = null;
  const el = document.getElementById('comboText');
  if (el) el.classList.remove('visible', 'hot', 'fire', 'bump');
}

// ── StreamElements real-time WebSocket ───────────────────────────
let seSocket = null;

function setSocketStatus(cls, txt) {
  const el = document.getElementById('se-status');
  if (el) { el.className = 'status ' + cls; el.textContent = '● ' + txt; }
}

function connectSESocket() {
  if (seSocket) { seSocket.disconnect(); seSocket = null; }
  if (!CONFIG.seJwt) { setSocketStatus('auth-off', 'no JWT'); return; }

  const handleEvent = (data) => {
    console.log('[SE event]', JSON.stringify(data));
    const type = data?.type;
    const d    = data?.data || {};
    const name = d.username || d.sender || d.name || 'Someone';
    const n    = parseInt(d.amount || d.count || 1, 10);

    switch (type) {
      case 'subscriber':
        if (d.gifted) {
          showNotif(`${d.gifter || 'Someone'} gifted a membership to ${name}!`);
        } else {
          const months = d.months > 1 ? ` (${d.months} months!)` : '';
          showNotif(`${name} just subscribed!${months}`);
        }
        addToCombo(1);
        break;
      case 'communityGiftPurchase':
        showNotif(`${name} gifted ${n} membership${n !== 1 ? 's' : ''} to the community!`);
        addToCombo(n);
        break;
      case 'superchat':
        showNotif(`${name} sent a Super Chat${d.message ? ': ' + d.message : ''}!`);
        break;
      case 'tip':
        showNotif(`${name} donated${d.amount ? ' £' + d.amount : ''}!`);
        break;
      default:
        // Unknown event type — still log so we can see the raw shape
        break;
    }
  };

  const init = () => {
    setSocketStatus('loading', 'connecting…');
    seSocket = window.io('https://realtime.streamelements.com', {
      transports: ['websocket']
    });

    seSocket.on('connect',    () => {
      setSocketStatus('loading', 'authenticating…');
      seSocket.emit('authenticate', { method: 'jwt', token: CONFIG.seJwt });
    });
    seSocket.on('authenticated',  () => setSocketStatus('live',  'connected'));
    seSocket.on('unauthorized',   () => setSocketStatus('error', 'bad JWT'));
    seSocket.on('connect_error',  (e) => { console.error('[SE] connect error', e); setSocketStatus('error', 'connection failed'); });

    // Live events and SE emulate both fire on 'event' or 'event:test'
    seSocket.on('event',      handleEvent);
    seSocket.on('event:test', handleEvent);

    seSocket.on('disconnect', () => {
      setSocketStatus('auth-off', 'disconnected');
      setTimeout(() => { if (CONFIG.seJwt) connectSESocket(); }, 10000);
    });
  };

  if (window.io) {
    init();
  } else {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/socket.io/2.5.0/socket.io.min.js';
    s.onload = init;
    s.onerror = () => setSocketStatus('error', 'script load failed');
    document.head.appendChild(s);
  }
}

// ── Boot ─────────────────────────────────────────────────────────
window.addEventListener('load', () => {
  loadSaved();
  initConsole();
  setSocketStatus('auth-off', CONFIG.seJwt ? 'connecting…' : 'no JWT');
  refresh();
  startRefreshTimer();
  connectSESocket();
});

// ── StreamElements overlay event integration ──────────────────────
// In OBS add this page as a Browser Source and paste your StreamElements
// overlay URL — SE injects its widget API into the page which fires
// onEventReceived for every stream event (memberships, gifts, etc).
window.addEventListener('onEventReceived', (obj) => {
  const e = obj?.detail?.event;
  const listener = obj?.detail?.listener;
  if (!e) return;

  const name  = e.sender   || e.name   || e.username  || 'Someone';
  const count = e.amount   || e.gifted || 1;

  switch (listener) {
    // New member / subscriber
    case 'subscriber-latest':
      if (e.gifted) {
        showNotif(`${e.gifter || 'Someone'} gifted a membership to ${name}!`);
      } else {
        const months = e.months > 1 ? ` (${e.months} months!)` : '';
        showNotif(`${name} just subscribed!${months}`);
      }
      addToCombo(1);
      break;

    // Bulk community gift (e.g. "gifted 5 memberships")
    case 'bulkgiftsub-latest':
    case 'communityGiftPurchase-latest':
      showNotif(`${name} gifted ${count} membership${count !== 1 ? 's' : ''} to the community!`);
      addToCombo(count);
      break;

    // Super Chat / Super Sticker
    case 'superchat-latest':
      showNotif(`${name} sent a Super Chat: ${e.message || ''}`);
      break;

    // Tip / donation
    case 'tip-latest':
      showNotif(`${name} donated ${e.amount ? '£' + e.amount : ''}!`);
      break;

    default:
      break;
  }
});

// Also handle the SE session-start ping so the overlay knows it's connected.
window.addEventListener('onWidgetLoad', () => {});
</script>
