<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Sub Bar Overlay</title>
  <style>
    @font-face {
      font-family: 'Eurostile';
      src: url('Eurostile BoldItalic.ttf') format('truetype');
      font-weight: bold;
      font-style: italic;
    }

    @font-face {
      font-family: 'Third Rail';
      src: url('Third Rail.ttf') format('truetype');
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { background: #0a1020; }

    body {
      width: 1280px;
      background: transparent;
      -webkit-font-smoothing: antialiased;
      font-family: Arial, sans-serif;
    }

    /* ════════════════════════════════════════
       BAR — BG.png is the pill; Loader.webm animates the full progress
       internally. We seek the video's currentTime to the frame that
       matches (currentSubs − start) / (end − start), and pause it
       there so it stays visible.
    ════════════════════════════════════════ */
    .bar-container {
      position: relative;
      width: 1280px;
    }

    .bar-bg {
      display: block;
      width: 100%;
      height: auto;
    }

    .bar-loader {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
    }

    /* ── Notification row ─────────────────── */
    .notif-row {
      width: 1280px;
      height: 38px;
      margin-top: -50px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      overflow: hidden;
    }

    .notif-text {
      font-family: 'Eurostile', 'Arial Black', sans-serif;
      font-weight: bold;
      font-style: italic;
      font-size: 22px;
      color: #fff;
      text-shadow: 0 1px 6px rgba(0,0,0,0.9), 0 0 22px rgba(94,232,252,0.45);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.4s ease, transform 0.4s ease;
      white-space: nowrap;
    }

    .notif-text.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ── Combo row ────────────────────────────── */
    .combo-row {
      width: 1280px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      overflow: hidden;
    }

    .combo-text {
      font-family: 'Eurostile', 'Arial Black', sans-serif;
      font-weight: bold;
      font-style: italic;
      color: #e0f0ff;
      font-size: 26px;
      text-shadow: 0 1px 6px rgba(0,0,0,0.9), 0 0 18px rgba(94,232,252,0.5);
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.3s ease, font-size 0.15s ease, color 0.15s ease, text-shadow 0.15s ease;
    }

    .combo-text.visible { opacity: 1; }

    /* x5 – x9: gold */
    .combo-text.hot {
      color: #ffd060;
      font-size: 32px;
      text-shadow: 0 1px 6px rgba(0,0,0,0.9), 0 0 28px rgba(255,200,0,0.85);
    }

    /* x10+: fire */
    .combo-text.fire {
      color: #ff7040;
      font-size: 40px;
      text-shadow: 0 1px 6px rgba(0,0,0,0.9),
                   0 0 30px rgba(255,100,0,0.9),
                   0 0 60px rgba(255,40,0,0.55);
    }

    @keyframes combo-bump {
      0%   { transform: scale(1); }
      45%  { transform: scale(1.22); }
      100% { transform: scale(1); }
    }
    .combo-text.bump { animation: combo-bump 0.28s ease; }

    /* BG.png bar strip ends at ~117px at 1280px display width.
       Milestones sit 5px below that, inside bar-container. */
    .milestone {
      position: absolute;
      top: 147px;
      color: #fff;
      font-family: 'Third Rail', 'Arial Black', sans-serif;
      font-size: 20px;
      white-space: nowrap;
      text-shadow: 0 1px 4px rgba(0,0,0,0.7);
      pointer-events: none;
      z-index: 3;
    }

    .milestone-start { left: 24px; }
    .milestone-end   { right: 24px; }

    /* ════════════════════════════════════════
       CONTROL CONSOLE
    ════════════════════════════════════════ */
    .console {
      width: 1280px;
      margin-top: 40px;
      background: #1a2d52;
      border-radius: 10px;
      border: 2px solid #2e4a82;
      padding: 0 14px 14px;
    }

    .console-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #152340;
      border-radius: 8px 8px 0 0;
      margin: 0 -14px 10px;
      padding: 7px 14px;
      border-bottom: 1px solid #2e4a82;
    }

    .console-title {
      color: #5ee8fc;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.8px;
      text-transform: uppercase;
    }

    .console-tip {
      color: #7898c0;
      font-size: 10px;
      font-style: italic;
    }

    .console-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 8px 10px;
    }

    .field label {
      display: block;
      color: #90b8e8;
      font-size: 9.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 3px;
    }

    .field input {
      width: 100%;
      background: #0e1e3a;
      border: 1px solid #3a5898;
      border-radius: 4px;
      padding: 5px 8px;
      color: #d8eaff;
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s;
    }

    .field input:focus {
      border-color: #5ee8fc;
      background: #122040;
    }

    .field input::placeholder { color: #4a6890; }

    /* colour field: swatch + hex text side by side */
    .color-field-wrap {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .color-swatch {
      width: 27px;
      height: 27px;
      border-radius: 4px;
      border: 1px solid #3a5898;
      flex-shrink: 0;
      cursor: default;
    }

    .color-hex {
      flex: 1;
      background: #0e1e3a;
      border: 1px solid #3a5898;
      border-radius: 4px;
      padding: 5px 8px;
      color: #d8eaff;
      font-size: 12px;
      outline: none;
      font-family: monospace;
      transition: border-color 0.15s;
    }

    .color-hex:focus { border-color: #5ee8fc; background: #122040; }

    .hex-prefix {
      color: #6a88b4;
      font-family: monospace;
      font-size: 12px;
      user-select: none;
      margin-right: -2px;
    }

    .field-span2 { grid-column: span 2; }

    /* Actions cells */
    .actions-cell label { visibility: hidden; }

    .console-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 27px;
    }

    .btn-action {
      background: #1e3a78;
      border: 1px solid #5e88d8;
      border-radius: 4px;
      color: #c8e0ff;
      font-size: 11px;
      font-weight: 700;
      padding: 0 12px;
      height: 100%;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
      flex-shrink: 0;
    }

    .btn-action:hover  { background: #28408a; }
    .btn-action:active { background: #0e2048; }

    .btn-action.btn-disconnect {
      background: #4a1a1a;
      border-color: #985050;
      color: #e8a0a0;
    }

    .status {
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .status.manual   { color: #7898c0; }
    .status.loading  { color: #aaaaaa; }
    .status.live     { color: #40dd80; }
    .status.error    { color: #ee5040; }
    .status.auth-off { color: #607090; }
    .status.auth-on  { color: #40dd80; }

    /* Divider between API-key row and OAuth row */
    .console-divider {
      grid-column: span 4;
      border: none;
      border-top: 1px solid #243a68;
      margin: 2px 0;
    }

    .field-span3 { grid-column: span 3; }
    .field-span4 { grid-column: span 4; }

  </style>
</head>
<body>

<!-- ── BAR ─────────────────────────────────────────────── -->
<div class="bar-container">
  <img class="bar-bg" src="BG.png" alt="">
  <video class="bar-loader" id="barLoader" muted playsinline preload="auto">
    <source src="Loader.webm" type="video/webm">
  </video>
  <span class="milestone milestone-start" id="startLabel"></span>
  <span class="milestone milestone-end" id="endLabel"></span>
</div>

<!-- ── NOTIFICATIONS ──────────────────────────────────────── -->
<div class="notif-row">
  <span class="notif-text" id="notifText"></span>
</div>

<!-- ── COMBO ──────────────────────────────────────────────── -->
<div class="combo-row">
  <span class="combo-text" id="comboText"></span>
</div>

<!-- ── CONTROL CONSOLE ────────────────────────────────────
     OBS: alt-drag the bottom edge of this source upward
     to crop out this panel. The bar stays visible.
──────────────────────────────────────────────────────── -->
<div class="console">
  <div class="console-header">
    <span class="console-title">⚙ Control Console</span>
    <span class="console-tip">OBS tip: alt-drag the bottom edge of this source upward to hide this panel</span>
    <button class="btn-action" id="btnTestNotif" style="margin-left:16px;white-space:nowrap;flex-shrink:0;">🔔 Test Notification</button>
    <button class="btn-action" id="btnTestCombo" style="margin-left:8px;white-space:nowrap;flex-shrink:0;">⚡ Test Combo</button>
  </div>

  <div class="console-grid">

    <!-- Row 1: milestones + colours -->
    <div class="field">
      <label>Start Milestone</label>
      <input id="c-start" type="number" placeholder="30000">
    </div>
    <div class="field">
      <label>End Milestone</label>
      <input id="c-end" type="number" placeholder="40000">
    </div>
    <div class="field">
      <label>Next Goal</label>
      <input id="c-next" type="number" placeholder="35000">
    </div>

    <!-- YouTube API -->
    <div class="field field-span3">
      <label>YouTube API Key — console.cloud.google.com → Enable "YouTube Data API v3" → Credentials → API Key</label>
      <input id="c-yt-key" type="password" placeholder="AIzaSy…">
    </div>
    <div class="field">
      <label>YouTube Channel ID</label>
      <input id="c-yt-channel" type="text" placeholder="UCxxxxxxxxxxxxxxxx">
    </div>

    <!-- Actions -->
    <div class="field">
      <label>Static Sub Count</label>
      <input id="c-static-subs" type="number" placeholder="0">
    </div>
    <div class="field">
      <label>Auto-refresh (seconds)</label>
      <input id="c-refresh" type="number" placeholder="60" min="10">
    </div>
    <div class="field actions-cell field-span2">
      <label>​</label>
      <div class="console-actions">
        <button class="btn-action" id="btnRefresh">↻ Refresh</button>
      </div>
    </div>

  </div>

</div>

<script>
// ================================================================
//  DEFAULTS — first-run values; overridden by console / localStorage
// ================================================================
const DEFAULTS = {
  startMilestone:  30000,         // Left end of bar
  endMilestone:    40000,         // Right end of bar
  nextMilestone:   35000,         // Next milestone label
  youtubeApiKey:   '',            // YouTube Data API key (free) — primary count source
  youtubeChannelId: '',           // YouTube channel ID (UCxxxxxxx)
  refreshSeconds:  600,           // Auto-refresh interval (seconds)
  staticSubCount:  0,             // Manual override if APIs unavailable
};

const CONFIG = Object.assign({}, DEFAULTS);

// ================================================================

const fmtK = n => {
  if (n >= 1e6) return (n / 1e6) + 'M';
  if (n >= 1e3) return (n / 1e3) + 'K';
  return String(n);
};

// ── Persistence ──────────────────────────────────────────────────
function loadSaved() {
  try {
    Object.assign(CONFIG, JSON.parse(localStorage.getItem('subbar_config') || '{}'));
  } catch (e) { /* first run */ }
}

function saveConfig() {
  localStorage.setItem('subbar_config', JSON.stringify(CONFIG));
}

// ── YouTube Data API ─────────────────────────────────────────────
// Free API key: console.cloud.google.com → New project → Library →
// "YouTube Data API v3" → Enable → Credentials → Create API Key.
async function fetchYouTubeSubs() {
  if (!CONFIG.youtubeApiKey || !CONFIG.youtubeChannelId) return null;
  try {
    const url = `https://www.googleapis.com/youtube/v3/channels`
              + `?part=statistics&id=${encodeURIComponent(CONFIG.youtubeChannelId)}`
              + `&key=${encodeURIComponent(CONFIG.youtubeApiKey)}`;
    const res = await fetch(url);
    if (!res.ok) return null;
    const data = await res.json();
    const count = data?.items?.[0]?.statistics?.subscriberCount;
    return count != null ? parseInt(count, 10) : null;
  } catch (e) { return null; }
}

// ── Bar rendering ────────────────────────────────────────────────
// OBS Browser Source silently rejects video.play() in some builds, so
// instead of relying on real playback we manually drive currentTime
// from 0 → target over ~2 s with requestAnimationFrame. Works in both
// Chrome and OBS because it doesn't touch the playback engine.
function seekLoader(pct) {
  const video = document.getElementById('barLoader');
  if (!video) return;
  const targetPct = Math.max(0, Math.min(1, pct / 100));

  if (video._rafId) {
    cancelAnimationFrame(video._rafId);
    video._rafId = null;
  }

  const animate = () => {
    if (!isFinite(video.duration) || video.duration <= 0) return;
    const stopAt = targetPct * video.duration;
    video.pause();
    if (stopAt <= 0) { video.currentTime = 0; return; }

    const start       = performance.now();
    const durationMs  = 2000;
    const step = (now) => {
      const progress = Math.min(1, (now - start) / durationMs);
      video.currentTime = progress * stopAt;
      if (progress < 1) video._rafId = requestAnimationFrame(step);
      else              video._rafId = null;
    };
    video._rafId = requestAnimationFrame(step);
  };

  if (video.readyState >= 2) animate();
  else video.addEventListener('loadeddata', animate, { once: true });
}

function updateUI(fillPct) {
  const pct = Math.max(0, Math.min(100, fillPct));
  seekLoader(pct);
  document.getElementById('startLabel').textContent = fmtK(CONFIG.startMilestone);
  document.getElementById('endLabel').textContent   = fmtK(CONFIG.endMilestone);
}

let refreshTimer = null;

function startRefreshTimer() {
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(refresh, Math.max(10, CONFIG.refreshSeconds) * 1000);
}

async function refresh() {
  let count = await fetchYouTubeSubs();
  if (count == null && CONFIG.staticSubCount > 0) count = CONFIG.staticSubCount;
  if (count == null) { updateUI(0); return; }
  const fillPct = (count - CONFIG.startMilestone)
                / (CONFIG.endMilestone - CONFIG.startMilestone) * 100;
  updateUI(fillPct);
}

// ── Console wiring ───────────────────────────────────────────────
function initConsole() {
  const bindings = [
    { id: 'c-start',       key: 'startMilestone',   parse: Number },
    { id: 'c-end',         key: 'endMilestone',     parse: Number },
    { id: 'c-next',        key: 'nextMilestone',    parse: Number },
    { id: 'c-refresh',     key: 'refreshSeconds',   parse: Number },
    { id: 'c-yt-key',      key: 'youtubeApiKey',    parse: String },
    { id: 'c-yt-channel',  key: 'youtubeChannelId', parse: String },
  ];

  for (const { id, key, parse } of bindings) {
    const el = document.getElementById(id);
    if (!el) continue;
    el.value = CONFIG[key];
    el.addEventListener('input', () => {
      const raw = el.value.trim();
      if (raw !== '') CONFIG[key] = parse(raw);
      saveConfig();
      refresh();
    });
  }

  const staticSubEl = document.getElementById('c-static-subs');
  if (staticSubEl) {
    staticSubEl.value = CONFIG.staticSubCount || '';
    staticSubEl.addEventListener('input', () => {
      const raw = staticSubEl.value.trim();
      CONFIG.staticSubCount = raw !== '' ? Number(raw) : 0;
      saveConfig();
      refresh();
    });
  }

  function wireColorField(inputId, swatchId, configKey, applyFn) {
    const el     = document.getElementById(inputId);
    const swatch = document.getElementById(swatchId);
    if (!el) return;
    // show stored value without the leading #
    el.value = (CONFIG[configKey] || '').replace(/^#/, '');
    if (swatch) swatch.style.background = CONFIG[configKey];
    el.addEventListener('input', () => {
      const raw = el.value.trim().replace(/^#/, '');
      if (!/^[0-9a-fA-F]{6}$/.test(raw)) return;
      const hex = '#' + raw.toLowerCase();
      CONFIG[configKey] = hex;
      if (swatch) swatch.style.background = hex;
      saveConfig();
      applyFn(hex);
    });
  }

  document.getElementById('btnRefresh')?.addEventListener('click', refresh);

  document.getElementById('btnTestCombo')?.addEventListener('click', () => addToCombo(1));

  const testMessages = [
    'RoryPlays has just joined as a member!',
    'xXSniper99Xx has been a member for 6 months!',
    'GiftKing gifted a membership to LuckyViewer!',
    'MegaFan gifted 5 memberships to the community!',
  ];
  let testIdx = 0;
  document.getElementById('btnTestNotif')?.addEventListener('click', () => {
    showNotif(testMessages[testIdx % testMessages.length]);
    testIdx++;
  });
}

// ── Notification queue ───────────────────────────────────────────
const notifQueue = [];
let notifBusy = false;

function showNotif(msg) {
  notifQueue.push(msg);
  if (!notifBusy) drainNotifQueue();
}

function drainNotifQueue() {
  if (!notifQueue.length) { notifBusy = false; return; }
  notifBusy = true;
  const el = document.getElementById('notifText');
  el.textContent = notifQueue.shift();
  el.classList.add('visible');
  setTimeout(() => {
    el.classList.remove('visible');
    setTimeout(drainNotifQueue, 450); // wait for fade-out
  }, 4500);
}

// ── Sub combo ────────────────────────────────────────────────────
let comboCount = 0;
let comboTimer = null;
const COMBO_RESET_MS = 7000;

function addToCombo(n) {
  comboCount += n;
  if (comboTimer) clearTimeout(comboTimer);
  comboTimer = setTimeout(resetCombo, COMBO_RESET_MS);
  updateComboDisplay();
}

function updateComboDisplay() {
  if (comboCount < 2) return;
  const el = document.getElementById('comboText');
  if (!el) return;
  el.textContent = `×${comboCount} SUB COMBO!`;
  el.classList.remove('hot', 'fire');
  if      (comboCount >= 10) el.classList.add('fire');
  else if (comboCount >= 5)  el.classList.add('hot');
  el.classList.add('visible');
  // bump animation: remove then re-add to retrigger
  el.classList.remove('bump');
  requestAnimationFrame(() => el.classList.add('bump'));
}

function resetCombo() {
  comboCount = 0;
  comboTimer = null;
  const el = document.getElementById('comboText');
  if (el) el.classList.remove('visible', 'hot', 'fire', 'bump');
}

// ── Boot ─────────────────────────────────────────────────────────
window.addEventListener('load', () => {
  loadSaved();
  initConsole();
  refresh();
  startRefreshTimer();
});
</script>
</body>
</html>
