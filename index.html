<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="dark">
  <title>Sub Bar Overlay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { background: #0a1020; }

    body {
      width: 1280px;
      background: transparent;
      -webkit-font-smoothing: antialiased;
      font-family: Arial, sans-serif;
    }

    /* ════════════════════════════════════════
       BAR
    ════════════════════════════════════════ */
    .bar-container {
      width: 1280px;
      background: #2d3f6e;
      border-radius: 10px;
      padding: 0 14px 8px;
      display: flex;
      flex-direction: column;
    }

    .indicator-row { flex: 0 0 48px; position: relative; }

    .indicator {
      position: absolute;
      bottom: 2px;
      display: flex;
      align-items: flex-end;
      gap: 6px;
    }

    .profile-pic {
      width: 46px; height: 46px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }

    .bar-row {
      flex: 0 0 36px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .milestone {
      color: #fff;
      font-family: 'Arial Black', Arial, sans-serif;
      font-size: 15px;
      font-weight: 900;
      min-width: 42px;
      text-align: center;
      flex-shrink: 0;
    }

    .bar-track {
      flex: 1;
      height: 36px;
      position: relative;
      overflow: hidden;
      border-radius: 3px;
    }

    .bar-track::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        90deg,
        #3a4d7c 0px, #3a4d7c 17px,
        #222c55 17px, #222c55 19px
      );
    }

    .bar-fill {
      position: absolute;
      inset: 0 auto 0 0;
      transition: width 0.6s ease;
    }

    /* ════════════════════════════════════════
       CONTROL CONSOLE
    ════════════════════════════════════════ */
    .console {
      width: 1280px;
      margin-top: 40px;
      background: #1a2d52;
      border-radius: 10px;
      border: 2px solid #2e4a82;
      padding: 0 14px 14px;
    }

    .console-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #152340;
      border-radius: 8px 8px 0 0;
      margin: 0 -14px 10px;
      padding: 7px 14px;
      border-bottom: 1px solid #2e4a82;
    }

    .console-title {
      color: #5ee8fc;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.8px;
      text-transform: uppercase;
    }

    .console-tip {
      color: #7898c0;
      font-size: 10px;
      font-style: italic;
    }

    .console-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 8px 10px;
    }

    .field label {
      display: block;
      color: #90b8e8;
      font-size: 9.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 3px;
    }

    .field input {
      width: 100%;
      background: #0e1e3a;
      border: 1px solid #3a5898;
      border-radius: 4px;
      padding: 5px 8px;
      color: #d8eaff;
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s;
    }

    .field input:focus {
      border-color: #5ee8fc;
      background: #122040;
    }

    .field input::placeholder { color: #4a6890; }

    .field input[type="color"] {
      padding: 2px 4px;
      height: 27px;
      cursor: pointer;
    }

    .field-span2 { grid-column: span 2; }

    /* Actions cells */
    .actions-cell label { visibility: hidden; }

    .console-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 27px;
    }

    .btn-action {
      background: #1e3a78;
      border: 1px solid #5e88d8;
      border-radius: 4px;
      color: #c8e0ff;
      font-size: 11px;
      font-weight: 700;
      padding: 0 12px;
      height: 100%;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
      flex-shrink: 0;
    }

    .btn-action:hover  { background: #28408a; }
    .btn-action:active { background: #0e2048; }

    .btn-action.btn-disconnect {
      background: #4a1a1a;
      border-color: #985050;
      color: #e8a0a0;
    }

    .status {
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .status.manual   { color: #7898c0; }
    .status.loading  { color: #aaaaaa; }
    .status.live     { color: #40dd80; }
    .status.error    { color: #ee5040; }
    .status.auth-off { color: #607090; }
    .status.auth-on  { color: #40dd80; }

    /* Divider between API-key row and OAuth row */
    .console-divider {
      grid-column: span 4;
      border: none;
      border-top: 1px solid #243a68;
      margin: 2px 0;
    }

    .field-span3 { grid-column: span 3; }
    .field-span4 { grid-column: span 4; }
  </style>
</head>
<body>

<!-- ── BAR ─────────────────────────────────────────────── -->
<div class="bar-container">
  <div class="indicator-row" id="indicatorRow">
    <div class="indicator" id="indicator">
      <img class="profile-pic" id="profilePic" src="" alt="streamer">
    </div>
  </div>

  <div class="bar-row">
    <span class="milestone" id="startLabel"></span>
    <div class="bar-track" id="barTrack">
      <div class="bar-fill" id="barFill" style="width:0"></div>
    </div>
    <span class="milestone" id="endLabel"></span>
  </div>
</div>

<!-- ── CONTROL CONSOLE ────────────────────────────────────
     OBS: alt-drag the bottom edge of this source upward
     to crop out this panel. The bar stays visible.
──────────────────────────────────────────────────────── -->
<div class="console">
  <div class="console-header">
    <span class="console-title">⚙ Control Console</span>
    <span class="console-tip">OBS tip: alt-drag the bottom edge of this source upward to hide this panel</span>
  </div>

  <div class="console-grid">

    <!-- Row 1: milestones + colour -->
    <div class="field">
      <label>Start Milestone</label>
      <input id="c-start" type="number" placeholder="30000">
    </div>
    <div class="field">
      <label>End Milestone</label>
      <input id="c-end" type="number" placeholder="40000">
    </div>
    <div class="field">
      <label>Next Goal</label>
      <input id="c-next" type="number" placeholder="35000">
    </div>
    <div class="field">
      <label>Bar Colour</label>
      <input id="c-barcolor" type="color" value="#5ee8fc">
    </div>

    <!-- Row 2: profile pic -->
    <div class="field field-span3">
      <label>Profile Pic — local filename or full URL</label>
      <input id="c-pic" type="text" placeholder="profile.jpg  or  https://…">
    </div>
    <div class="field actions-cell">
      <label>​</label>
      <div class="console-actions">
        <button class="btn-action" id="btnRefresh">↻ Apply</button>
      </div>
    </div>

  </div>

</div>

<script>
// ================================================================
//  DEFAULTS — first-run values; overridden by console / localStorage
// ================================================================
const DEFAULTS = {
  startMilestone: 30000,         // Left end of bar
  endMilestone:   40000,         // Right end of bar
  nextMilestone:  35000,         // Next milestone label
  barFill:        0,             // Bar fill % (0–100)
  profilePicUrl:  'profile.jpg', // Local filename or URL
  barColor:       '#5ee8fc',     // Bar fill colour
};

const CONFIG = Object.assign({}, DEFAULTS);

// ================================================================

const fmtK = n => {
  if (n >= 1e6) return (n / 1e6) + 'M';
  if (n >= 1e3) return (n / 1e3) + 'K';
  return String(n);
};

// ── Persistence ──────────────────────────────────────────────────
function loadSaved() {
  try {
    Object.assign(CONFIG, JSON.parse(localStorage.getItem('subbar_config') || '{}'));
  } catch (e) { /* first run */ }
}

function saveConfig() {
  localStorage.setItem('subbar_config', JSON.stringify(CONFIG));
}

// ── Bar colour ───────────────────────────────────────────────────
function applyBarColor(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  const dark = `rgb(${Math.max(0,r-30)},${Math.max(0,g-30)},${Math.max(0,b-30)})`;
  document.getElementById('barFill').style.background =
    `repeating-linear-gradient(90deg,${hex} 0px,${hex} 17px,${dark} 17px,${dark} 19px)`;
}

// ── Bar rendering ────────────────────────────────────────────────
function positionIndicator(pct) {
  const row   = document.getElementById('indicatorRow');
  const track = document.getElementById('barTrack');
  const ind   = document.getElementById('indicator');
  const rR    = row.getBoundingClientRect();
  const tR    = track.getBoundingClientRect();
  const fillEndX = (tR.left - rR.left) + tR.width * pct;
  let left = fillEndX - ind.offsetWidth;
  left = Math.max(0, Math.min(left, rR.width - ind.offsetWidth));
  ind.style.left = left + 'px';
}

function updateUI() {
  const pct = CONFIG.barFill / 100;
  document.getElementById('barFill').style.width  = CONFIG.barFill + '%';
  document.getElementById('startLabel').textContent = fmtK(CONFIG.startMilestone);
  document.getElementById('endLabel').textContent   = fmtK(CONFIG.endMilestone);
  document.getElementById('profilePic').src         = CONFIG.profilePicUrl;
  requestAnimationFrame(() => positionIndicator(pct));
}

function refresh() {
  updateUI();
}

// ── Console wiring ───────────────────────────────────────────────
function initConsole() {
  const bindings = [
    { id: 'c-start', key: 'startMilestone', parse: Number },
    { id: 'c-end',   key: 'endMilestone',   parse: Number },
    { id: 'c-next',  key: 'nextMilestone',  parse: Number },
    { id: 'c-pic',   key: 'profilePicUrl',  parse: String },
  ];

  for (const { id, key, parse } of bindings) {
    const el = document.getElementById(id);
    if (!el) continue;
    el.value = CONFIG[key];
    el.addEventListener('input', () => {
      const raw = el.value.trim();
      if (raw !== '') CONFIG[key] = parse(raw);
      saveConfig();
      refresh();
    });
  }

  const colorEl = document.getElementById('c-barcolor');
  if (colorEl) {
    colorEl.value = CONFIG.barColor;
    colorEl.addEventListener('input', () => {
      CONFIG.barColor = colorEl.value;
      saveConfig();
      applyBarColor(CONFIG.barColor);
    });
  }

  document.getElementById('btnRefresh')?.addEventListener('click', refresh);
}

// ── Boot ─────────────────────────────────────────────────────────
window.addEventListener('load', () => {
  loadSaved();
  initConsole();
  applyBarColor(CONFIG.barColor);
  refresh();
});
</script>
</body>
</html>
