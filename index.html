<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="dark">
  <title>Sub Bar Overlay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { background: #0a1020; }

    body {
      width: 1280px;
      background: transparent;
      -webkit-font-smoothing: antialiased;
      font-family: Arial, sans-serif;
    }

    /* ════════════════════════════════════════
       BAR
    ════════════════════════════════════════ */
    .bar-container {
      width: 1280px;
      height: 110px;
      background: #2d3f6e;
      border-radius: 10px;
      padding: 0 14px 4px;
      display: flex;
      flex-direction: column;
    }

    .indicator-row { flex: 0 0 48px; position: relative; }

    .indicator {
      position: absolute;
      bottom: 2px;
      display: flex;
      align-items: flex-end;
      gap: 6px;
    }

    .sub-count-box {
      background: #182848;
      border: 2.5px solid #5888ee;
      border-radius: 7px;
      padding: 4px 14px;
      font-family: 'Arial Black', Arial, sans-serif;
      font-size: 22px;
      font-weight: 900;
      color: #fff;
      white-space: nowrap;
      letter-spacing: 0.5px;
    }

    .profile-pic {
      width: 46px; height: 46px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }

    .bar-row {
      flex: 0 0 36px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .milestone {
      color: #fff;
      font-family: 'Arial Black', Arial, sans-serif;
      font-size: 15px;
      font-weight: 900;
      min-width: 42px;
      text-align: center;
      flex-shrink: 0;
    }

    .bar-track {
      flex: 1;
      height: 36px;
      position: relative;
      overflow: hidden;
      border-radius: 3px;
    }

    .bar-track::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        90deg,
        #3a4d7c 0px, #3a4d7c 17px,
        #222c55 17px, #222c55 19px
      );
    }

    .bar-fill {
      position: absolute;
      inset: 0 auto 0 0;
      background: repeating-linear-gradient(
        90deg,
        #5ee8fc 0px, #5ee8fc 17px,
        #26c5dc 17px, #26c5dc 19px
      );
      transition: width 0.6s ease;
    }

    .info-row {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 2px 52px 0;
    }

    .goal-text {
      flex: 1;
      text-align: center;
      font-family: 'Arial Black', Arial, sans-serif;
      font-size: 14px;
      font-weight: 900;
      color: #f0e040;
      letter-spacing: 0.5px;
    }

    .goal-text .num { font-size: 17px; }

    /* ════════════════════════════════════════
       CONTROL CONSOLE
    ════════════════════════════════════════ */
    .console {
      width: 1280px;
      margin-top: 40px;
      background: #1a2d52;
      border-radius: 10px;
      border: 2px solid #2e4a82;
      padding: 0 14px 14px;
    }

    .console-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #152340;
      border-radius: 8px 8px 0 0;
      margin: 0 -14px 10px;
      padding: 7px 14px;
      border-bottom: 1px solid #2e4a82;
    }

    .console-title {
      color: #5ee8fc;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.8px;
      text-transform: uppercase;
    }

    .console-tip {
      color: #7898c0;
      font-size: 10px;
      font-style: italic;
    }

    .console-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 8px 10px;
    }

    .field label {
      display: block;
      color: #90b8e8;
      font-size: 9.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 3px;
    }

    .field input {
      width: 100%;
      background: #0e1e3a;
      border: 1px solid #3a5898;
      border-radius: 4px;
      padding: 5px 8px;
      color: #d8eaff;
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s;
    }

    .field input:focus {
      border-color: #5ee8fc;
      background: #122040;
    }

    .field input::placeholder { color: #4a6890; }

    .field-span2 { grid-column: span 2; }

    /* Actions cells */
    .actions-cell label { visibility: hidden; }

    .console-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 27px;
    }

    .btn-action {
      background: #1e3a78;
      border: 1px solid #5e88d8;
      border-radius: 4px;
      color: #c8e0ff;
      font-size: 11px;
      font-weight: 700;
      padding: 0 12px;
      height: 100%;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
      flex-shrink: 0;
    }

    .btn-action:hover  { background: #28408a; }
    .btn-action:active { background: #0e2048; }

    .btn-action.btn-connect {
      background: #1a4a28;
      border-color: #3a9858;
      color: #a0e8b8;
    }

    .btn-action.btn-connect:hover  { background: #245830; }
    .btn-action.btn-disconnect {
      background: #4a1a1a;
      border-color: #985050;
      color: #e8a0a0;
    }

    .status {
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .status.manual   { color: #7898c0; }
    .status.loading  { color: #aaaaaa; }
    .status.live     { color: #40dd80; }
    .status.error    { color: #ee5040; }
    .status.auth-off { color: #607090; }
    .status.auth-on  { color: #40dd80; }
    .status.auth-pending { color: #e8c840; }

    /* Divider between API-key row and OAuth row */
    .console-divider {
      grid-column: span 4;
      border: none;
      border-top: 1px solid #243a68;
      margin: 2px 0;
    }

    /* ── Auth prompt (shown during device code flow) ── */
    .auth-prompt {
      display: none;
      margin-top: 12px;
      padding: 12px 16px;
      background: #0c1a30;
      border-radius: 6px;
      border: 1px solid #3a5898;
    }

    .auth-prompt.visible { display: block; }

    .auth-prompt-title {
      color: #5ee8fc;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .auth-steps {
      display: flex;
      gap: 40px;
      align-items: flex-start;
    }

    .auth-step-label {
      color: #7898c0;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 4px;
    }

    .auth-url-val {
      color: #d8eaff;
      font-size: 13px;
      font-weight: 700;
      font-family: monospace;
      background: #0e1e3a;
      border: 1px solid #3a5898;
      border-radius: 3px;
      padding: 4px 10px;
      display: inline-block;
    }

    .auth-code-val {
      color: #5ee8fc;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 5px;
      font-family: 'Arial Black', monospace;
    }

    .auth-waiting {
      margin-top: 10px;
      color: #7898c0;
      font-size: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .auth-cancel {
      color: #9898a8;
      font-size: 10px;
      background: none;
      border: 1px solid #3a4060;
      border-radius: 3px;
      padding: 2px 8px;
      cursor: pointer;
    }

    .auth-cancel:hover { color: #e0e0f0; border-color: #6060a0; }
  </style>
</head>
<body>

<!-- ── BAR ─────────────────────────────────────────────── -->
<div class="bar-container">
  <div class="indicator-row" id="indicatorRow">
    <div class="indicator" id="indicator">
      <div class="sub-count-box" id="subCountBox"></div>
      <img class="profile-pic" id="profilePic" src="" alt="streamer">
    </div>
  </div>

  <div class="bar-row">
    <span class="milestone" id="startLabel"></span>
    <div class="bar-track" id="barTrack">
      <div class="bar-fill" id="barFill" style="width:0"></div>
    </div>
    <span class="milestone" id="endLabel"></span>
  </div>

  <div class="info-row">
    <div class="goal-text">
      <span class="num" id="subsNeeded"></span> more subs to <span id="nextMilestoneText"></span>!
    </div>
  </div>
</div>

<!-- ── CONTROL CONSOLE ────────────────────────────────────
     OBS: alt-drag the bottom edge of this source upward
     to crop out this panel. The bar stays visible.
──────────────────────────────────────────────────────── -->
<div class="console">
  <div class="console-header">
    <span class="console-title">⚙ Control Console</span>
    <span class="console-tip">OBS tip: alt-drag the bottom edge of this source upward to hide this panel</span>
  </div>

  <div class="console-grid">

    <!-- Row 1: milestones + manual count -->
    <div class="field">
      <label>Start Milestone</label>
      <input id="c-start" type="number" placeholder="300000">
    </div>
    <div class="field">
      <label>End Milestone</label>
      <input id="c-end" type="number" placeholder="400000">
    </div>
    <div class="field">
      <label>Next Goal</label>
      <input id="c-next" type="number" placeholder="325000">
    </div>
    <div class="field">
      <label>Current Subs (manual)</label>
      <input id="c-subs" type="number" placeholder="34686">
    </div>

    <!-- Row 2: visual settings -->
    <div class="field field-span2">
      <label>Profile Pic — local filename or full URL</label>
      <input id="c-pic" type="text" placeholder="profile.jpg  or  https://…">
    </div>
    <div class="field">
      <label>Auto-refresh (seconds)</label>
      <input id="c-refresh" type="number" placeholder="60" min="10">
    </div>

    <!-- Row 3: API key (approximate, no auth required) -->
    <div class="field field-span2">
      <label>YouTube Channel ID — for approximate count (API key)</label>
      <input id="c-channel" type="text" placeholder="UCxxxxxxxxxxxxxxxxxxxxx">
    </div>
    <div class="field">
      <label>YouTube API Key (approximate ±100)</label>
      <input id="c-apikey" type="password" placeholder="AIza…">
    </div>
    <div class="field actions-cell">
      <label>​</label>
      <div class="console-actions">
        <button class="btn-action" id="btnRefresh">↻ Refresh</button>
        <span class="status manual" id="statusBadge">● Manual</span>
      </div>
    </div>

    <hr class="console-divider">

    <!-- Row 4: OAuth (exact count) -->
    <div class="field field-span2">
      <label>OAuth Client ID — for EXACT count (see README)</label>
      <input id="c-clientid" type="text" placeholder="000000000000-xxxxxxxx.apps.googleusercontent.com">
    </div>
    <div class="field">
      <label>OAuth Client Secret</label>
      <input id="c-clientsecret" type="password" placeholder="GOCSPX-…">
    </div>
    <div class="field actions-cell">
      <label>​</label>
      <div class="console-actions">
        <button class="btn-action btn-connect" id="btnConnect">Connect YT Account</button>
        <span class="status auth-off" id="authBadge">● Not connected</span>
      </div>
    </div>

  </div>

  <!-- Device code prompt (shown during OAuth flow) -->
  <div class="auth-prompt" id="authPrompt">
    <div class="auth-prompt-title">Authorize YouTube Access</div>
    <div class="auth-steps">
      <div>
        <div class="auth-step-label">1 · Visit this URL on any device</div>
        <span class="auth-url-val" id="authUrl"></span>
      </div>
      <div>
        <div class="auth-step-label">2 · Enter this code</div>
        <span class="auth-code-val" id="authCode"></span>
      </div>
    </div>
    <div class="auth-waiting">
      <span id="authWaiting">⏳ Waiting for you to authorize…</span>
      <button class="auth-cancel" id="btnCancelAuth">Cancel</button>
    </div>
  </div>

</div>

<script>
// ================================================================
//  DEFAULTS — first-run values; overridden by console / localStorage
// ================================================================
const DEFAULTS = {
  currentSubs:      34686,       // Manual sub count (exact fallback)
  startMilestone:   30000,       // Left end of bar
  endMilestone:     40000,       // Right end of bar
  nextMilestone:    35000,       // Next milestone to reach
  profilePicUrl:    'profile.jpg', // Local filename or URL
  youtubeChannelId: '',           // Channel ID for approximate API-key count
  youtubeApiKey:    '',           // YouTube Data API v3 key (approximate ±100)
  oauthClientId:    '',           // OAuth Client ID for exact count
  oauthClientSecret: '',          // OAuth Client Secret
  oauthRefreshToken: '',          // Stored after first auth — keep private
  refreshSeconds:   60,           // How often to poll YouTube
};

const CONFIG = Object.assign({}, DEFAULTS);

// Transient OAuth state (not persisted — refreshed each session)
const oauth = { accessToken: '', expiresAt: 0, pollTimer: null };

// ================================================================

const fmt  = n => Math.round(n).toLocaleString('en-US');
const fmtK = n => {
  if (n >= 1e6) return (n / 1e6) + 'M';
  if (n >= 1e3) return (n / 1e3) + 'K';
  return String(n);
};

function nextRoundNumber(n) {
  let step;
  if      (n <    10000) step =   500;
  else if (n <   100000) step =  1000;
  else if (n <  1000000) step =  5000;
  else                   step = 50000;
  return Math.ceil((n + 1) / step) * step;
}

// ── Persistence ──────────────────────────────────────────────────
function loadSaved() {
  try {
    Object.assign(CONFIG, JSON.parse(localStorage.getItem('subbar_config') || '{}'));
  } catch (e) { /* first run */ }
}

function saveConfig() {
  localStorage.setItem('subbar_config', JSON.stringify(CONFIG));
}

// ── Status / auth badges ─────────────────────────────────────────
function setStatus(state, text) {
  const el = document.getElementById('statusBadge');
  if (el) { el.className = 'status ' + state; el.textContent = '● ' + text; }
}

function setAuthBadge(state) {
  const el  = document.getElementById('authBadge');
  const btn = document.getElementById('btnConnect');
  if (!el || !btn) return;
  const labels = {
    'auth-off':     ['● Not connected',  'Connect YT Account', 'btn-action btn-connect'],
    'auth-pending': ['● Connecting…',    'Cancel',             'btn-action'],
    'auth-on':      ['● Connected ✓',    'Disconnect',         'btn-action btn-disconnect'],
  };
  const [badge, btnText, btnClass] = labels[state] || labels['auth-off'];
  el.className    = 'status ' + state;
  el.textContent  = badge;
  btn.textContent = btnText;
  btn.className   = btnClass;
}

// ── Bar rendering ────────────────────────────────────────────────
function positionIndicator(pct) {
  const row   = document.getElementById('indicatorRow');
  const track = document.getElementById('barTrack');
  const ind   = document.getElementById('indicator');
  const rR    = row.getBoundingClientRect();
  const tR    = track.getBoundingClientRect();
  const fillEndX = (tR.left - rR.left) + tR.width * pct;
  let left = fillEndX - ind.offsetWidth;
  left = Math.max(0, Math.min(left, rR.width - ind.offsetWidth));
  ind.style.left = left + 'px';
}

function updateUI(subs) {
  if (subs >= CONFIG.nextMilestone) {
    CONFIG.nextMilestone = nextRoundNumber(subs);
    saveConfig();
    const el = document.getElementById('c-next');
    if (el) el.value = CONFIG.nextMilestone;
  }

  const { startMilestone, endMilestone, nextMilestone } = CONFIG;
  const pct = Math.max(0, Math.min(1,
    (subs - startMilestone) / (endMilestone - startMilestone)));

  document.getElementById('barFill').style.width           = (pct * 100) + '%';
  document.getElementById('subCountBox').textContent       = fmt(subs);
  document.getElementById('subsNeeded').textContent        = fmt(Math.max(0, nextMilestone - subs));
  document.getElementById('nextMilestoneText').textContent = fmt(nextMilestone);
  document.getElementById('startLabel').textContent        = fmtK(startMilestone);
  document.getElementById('endLabel').textContent          = fmtK(endMilestone);
  document.getElementById('profilePic').src                = CONFIG.profilePicUrl;

  requestAnimationFrame(() => positionIndicator(pct));
}

// ── OAuth — Device Authorization Flow ───────────────────────────
async function getAccessToken() {
  if (!CONFIG.oauthRefreshToken || !CONFIG.oauthClientId) return null;

  if (oauth.accessToken && oauth.expiresAt > Date.now() + 60_000) {
    return oauth.accessToken;
  }

  try {
    const res = await fetch('https://oauth2.googleapis.com/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({
        client_id:     CONFIG.oauthClientId,
        client_secret: CONFIG.oauthClientSecret,
        refresh_token: CONFIG.oauthRefreshToken,
        grant_type:    'refresh_token',
      }),
    });
    const data = await res.json();
    if (data.access_token) {
      oauth.accessToken = data.access_token;
      oauth.expiresAt   = Date.now() + data.expires_in * 1000;
      return oauth.accessToken;
    }
    CONFIG.oauthRefreshToken = '';
    saveConfig();
    setAuthBadge('auth-off');
  } catch (e) {
    console.warn('Token refresh failed:', e);
  }
  return null;
}

async function startOAuthFlow() {
  if (!CONFIG.oauthClientId || !CONFIG.oauthClientSecret) {
    alert('Enter your OAuth Client ID and Client Secret first.');
    return;
  }

  setAuthBadge('auth-pending');

  let deviceData;
  try {
    const res = await fetch('https://oauth2.googleapis.com/device/code', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({
        client_id: CONFIG.oauthClientId,
        scope: 'https://www.googleapis.com/auth/youtube.readonly',
      }),
    });
    deviceData = await res.json();
  } catch (e) {
    alert('Could not reach Google — check your internet connection.');
    setAuthBadge('auth-off');
    return;
  }

  if (deviceData.error) {
    alert(`Google rejected the auth request:\n\n${deviceData.error}: ${deviceData.error_description || ''}\n\nMake sure the YouTube Analytics API is enabled in Google Cloud Console and the scope is added to your OAuth consent screen.`);
    setAuthBadge('auth-off');
    return;
  }

  document.getElementById('authUrl').textContent  = deviceData.verification_url;
  document.getElementById('authCode').textContent = deviceData.user_code;
  document.getElementById('authWaiting').textContent = '⏳ Waiting for you to authorize…';
  document.getElementById('authPrompt').classList.add('visible');

  const interval = (deviceData.interval || 5) * 1000;
  const deadline = Date.now() + deviceData.expires_in * 1000;

  oauth.pollTimer = setInterval(async () => {
    if (Date.now() > deadline) { cancelOAuth('Code expired. Try again.'); return; }

    try {
      const res = await fetch('https://oauth2.googleapis.com/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({
          client_id:     CONFIG.oauthClientId,
          client_secret: CONFIG.oauthClientSecret,
          device_code:   deviceData.device_code,
          grant_type:    'urn:ietf:params:oauth:grant-type:device_code',
        }),
      });
      const data = await res.json();

      if (data.access_token) {
        clearInterval(oauth.pollTimer);
        oauth.accessToken = data.access_token;
        oauth.expiresAt   = Date.now() + data.expires_in * 1000;
        CONFIG.oauthRefreshToken = data.refresh_token;
        saveConfig();
        document.getElementById('authPrompt').classList.remove('visible');
        setAuthBadge('auth-on');
        startRefreshTimer();
        refresh();
      } else if (data.error === 'slow_down') {
        clearInterval(oauth.pollTimer);
        oauth.pollTimer = setInterval(arguments.callee, interval + 5000);
      }
    } catch (e) { /* network blip, keep polling */ }
  }, interval);
}

function cancelOAuth(msg) {
  clearInterval(oauth.pollTimer);
  document.getElementById('authPrompt').classList.remove('visible');
  if (msg) document.getElementById('authWaiting').textContent = msg;
  setAuthBadge(CONFIG.oauthRefreshToken ? 'auth-on' : 'auth-off');
}

function disconnectOAuth() {
  oauth.accessToken = '';
  oauth.expiresAt   = 0;
  CONFIG.oauthRefreshToken = '';
  saveConfig();
  setAuthBadge('auth-off');
  setStatus('manual', 'Manual');
  startRefreshTimer();
}

// ── YouTube fetch ────────────────────────────────────────────────
async function fetchYouTubeSubs() {
  // 1. Prefer OAuth — authenticated channel owner gets exact (unrounded) count
  const token = await getAccessToken();
  if (token) {
    try {
      const res  = await fetch(
        'https://www.googleapis.com/youtube/v3/channels?part=statistics&mine=true',
        { headers: { Authorization: `Bearer ${token}` } }
      );
      const data = await res.json();
      if (data.items?.[0]?.statistics?.subscriberCount != null) {
        return parseInt(data.items[0].statistics.subscriberCount, 10);
      }
    } catch (e) {
      console.warn('OAuth fetch failed:', e);
    }
  }

  // 2. Fall back to API key (rounds to 3 significant figures)
  const { youtubeChannelId, youtubeApiKey } = CONFIG;
  if (!youtubeChannelId || !youtubeApiKey) return null;
  try {
    const res  = await fetch(
      `https://www.googleapis.com/youtube/v3/channels?part=statistics&id=${youtubeChannelId}&key=${youtubeApiKey}`
    );
    const data = await res.json();
    return parseInt(data.items[0].statistics.subscriberCount, 10);
  } catch (e) {
    console.warn('API key fetch failed:', e);
    return null;
  }
}

let refreshTimer = null;

function startRefreshTimer() {
  if (refreshTimer) clearInterval(refreshTimer);
  const hasOAuth  = CONFIG.oauthRefreshToken && CONFIG.oauthClientId;
  const hasApiKey = CONFIG.youtubeChannelId  && CONFIG.youtubeApiKey;
  if (hasOAuth || hasApiKey) {
    refreshTimer = setInterval(refresh, Math.max(10, CONFIG.refreshSeconds) * 1000);
  }
}

async function refresh() {
  const hasOAuth  = CONFIG.oauthRefreshToken && CONFIG.oauthClientId;
  const hasApiKey = CONFIG.youtubeChannelId  && CONFIG.youtubeApiKey;

  let subs = CONFIG.currentSubs;

  if (hasOAuth || hasApiKey) {
    setStatus('loading', 'Fetching…');
    const live = await fetchYouTubeSubs();
    if (live !== null) {
      // With OAuth: exact — use directly.
      // With API key only: rounded — never go below manual count.
      subs = hasOAuth ? live : Math.max(live, CONFIG.currentSubs);
      if (subs > CONFIG.currentSubs) {
        CONFIG.currentSubs = subs;
        saveConfig();
        const el = document.getElementById('c-subs');
        if (el) el.value = subs;
      }
      setStatus('live', `Live · ${fmt(subs)}${hasOAuth ? '' : ' (approx)'}`);
    } else {
      setStatus('error', 'Fetch Error');
    }
  } else {
    setStatus('manual', 'Manual');
  }
  updateUI(subs);
}

// ── Console wiring ───────────────────────────────────────────────
function initConsole() {
  const bindings = [
    { id: 'c-start',        key: 'startMilestone',   parse: Number },
    { id: 'c-end',          key: 'endMilestone',     parse: Number },
    { id: 'c-next',         key: 'nextMilestone',    parse: Number },
    { id: 'c-subs',         key: 'currentSubs',      parse: Number },
    { id: 'c-pic',          key: 'profilePicUrl',    parse: String },
    { id: 'c-refresh',      key: 'refreshSeconds',   parse: Number },
    { id: 'c-channel',      key: 'youtubeChannelId', parse: String },
    { id: 'c-apikey',       key: 'youtubeApiKey',    parse: String },
    { id: 'c-clientid',     key: 'oauthClientId',    parse: String },
    { id: 'c-clientsecret', key: 'oauthClientSecret',parse: String },
  ];

  for (const { id, key, parse } of bindings) {
    const el = document.getElementById(id);
    if (!el) continue;
    el.value = CONFIG[key];
    el.addEventListener('input', () => {
      const raw = el.value.trim();
      if (raw !== '') CONFIG[key] = parse(raw);
      saveConfig();
      startRefreshTimer();
      refresh();
    });
  }

  document.getElementById('btnRefresh')?.addEventListener('click', refresh);

  document.getElementById('btnConnect')?.addEventListener('click', () => {
    if (CONFIG.oauthRefreshToken) {
      disconnectOAuth();
    } else {
      startOAuthFlow();
    }
  });

  document.getElementById('btnCancelAuth')?.addEventListener('click', () => cancelOAuth());

  // Restore auth badge state from saved token
  if (CONFIG.oauthRefreshToken) setAuthBadge('auth-on');
}

// ── Boot ─────────────────────────────────────────────────────────
window.addEventListener('load', () => {
  loadSaved();
  initConsole();
  refresh();
  startRefreshTimer();
});
</script>
</body>
</html>
