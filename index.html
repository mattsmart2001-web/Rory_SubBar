<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Sub Bar Overlay</title>
  <style>
    @font-face {
      font-family: 'Eurostile';
      src: url('Eurostile BoldItalic.ttf') format('truetype');
      font-weight: bold;
      font-style: italic;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { background: #0a1020; }

    body {
      width: 1280px;
      background: transparent;
      -webkit-font-smoothing: antialiased;
      font-family: Arial, sans-serif;
    }

    /* ════════════════════════════════════════
       BAR
    ════════════════════════════════════════ */
    .bar-container {
      width: 1280px;
      background: var(--pill-bg, rgba(45, 63, 110, 0.60));
      border-radius: 50px;
      padding: 0 24px;
    }

    /* ── Notification row ─────────────────── */
    .notif-row {
      width: 1280px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      overflow: hidden;
    }

    .notif-text {
      font-family: 'Eurostile', 'Arial Black', sans-serif;
      font-weight: bold;
      font-style: italic;
      font-size: 22px;
      color: #fff;
      text-shadow: 0 1px 6px rgba(0,0,0,0.9), 0 0 22px rgba(94,232,252,0.45);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.4s ease, transform 0.4s ease;
      white-space: nowrap;
    }

    .notif-text.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .bar-row {
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
      padding: 12px 0;   /* vertical breathing room for profile pic overflow */
    }

    .milestone {
      color: #fff;
      font-family: 'Eurostile', 'Arial Black', sans-serif;
      font-weight: bold;
      font-style: italic;
      font-size: 18px;
      min-width: 52px;
      text-align: center;
      flex-shrink: 0;
      white-space: nowrap;
      text-shadow: 0 1px 4px rgba(0,0,0,0.7);
    }

    .bar-track {
      flex: 1;
      height: 18px;
      position: relative;
      clip-path: polygon(7px 0, 100% 0, calc(100% - 7px) 100%, 0 100%);
    }

    /* empty track — dark slanted notches */
    .bar-track::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        110deg,
        var(--track-light, #2c3d5e) 0px, var(--track-light, #2c3d5e) 7px,
        var(--track-dark,  #1c2c48) 7px, var(--track-dark,  #1c2c48) 9px
      );
    }

    /* bevel overlay — sits above fill and track */
    .bar-track::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(255,255,255,0.14) 0%,
        rgba(255,255,255,0.04) 45%,
        rgba(0,0,0,0.0)        55%,
        rgba(0,0,0,0.30)      100%
      );
      pointer-events: none;
      z-index: 3;
    }

    .bar-fill {
      position: absolute;
      inset: 0 auto 0 0;
      transition: width 0.6s ease;
      /* background set dynamically by applyBarColor() */
      -webkit-mask-image: linear-gradient(to right, black calc(100% - 14px), transparent 100%);
      mask-image: linear-gradient(to right, black calc(100% - 14px), transparent 100%);
    }

    .profile-pic {
      position: absolute;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      z-index: 4;
      top: 50%;
      transform: translate(-50%, -50%);
      /* left set by positionIndicator() */
      border: 2px solid rgba(255,255,255,0.45);
      box-shadow: 0 0 6px rgba(0,0,0,0.7);
    }

    .live-count-pill {
      position: absolute;
      top: 50%;
      /* left is set to the same x as the profile pic;
         translateX shifts it left by its own width + pic-radius (21px) + gap (6px) */
      transform: translateY(-50%) translateX(calc(-100% - 27px));
      background: var(--pill-bg, rgba(45, 63, 110, 0.60));
      border: 1px solid rgba(94, 232, 252, 0.22);
      border-radius: 10px;
      padding: 3px 10px;
      font-family: 'Eurostile', 'Arial Black', sans-serif;
      font-weight: bold;
      font-style: italic;
      font-size: 13px;
      color: #5ee8fc;
      text-shadow: 0 0 10px rgba(94, 232, 252, 0.35);
      white-space: nowrap;
      z-index: 5;
      pointer-events: none;
    }
    .live-count-pill:empty { display: none; }

    /* ════════════════════════════════════════
       CONTROL CONSOLE
    ════════════════════════════════════════ */
    .console {
      width: 1280px;
      margin-top: 40px;
      background: #1a2d52;
      border-radius: 10px;
      border: 2px solid #2e4a82;
      padding: 0 14px 14px;
    }

    .console-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #152340;
      border-radius: 8px 8px 0 0;
      margin: 0 -14px 10px;
      padding: 7px 14px;
      border-bottom: 1px solid #2e4a82;
    }

    .console-title {
      color: #5ee8fc;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.8px;
      text-transform: uppercase;
    }

    .console-tip {
      color: #7898c0;
      font-size: 10px;
      font-style: italic;
    }

    .console-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 8px 10px;
    }

    .field label {
      display: block;
      color: #90b8e8;
      font-size: 9.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 3px;
    }

    .field input {
      width: 100%;
      background: #0e1e3a;
      border: 1px solid #3a5898;
      border-radius: 4px;
      padding: 5px 8px;
      color: #d8eaff;
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s;
    }

    .field input:focus {
      border-color: #5ee8fc;
      background: #122040;
    }

    .field input::placeholder { color: #4a6890; }

    .field input[type="color"] {
      padding: 2px 4px;
      height: 27px;
      cursor: pointer;
    }

    .field-span2 { grid-column: span 2; }

    /* Actions cells */
    .actions-cell label { visibility: hidden; }

    .console-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 27px;
    }

    .btn-action {
      background: #1e3a78;
      border: 1px solid #5e88d8;
      border-radius: 4px;
      color: #c8e0ff;
      font-size: 11px;
      font-weight: 700;
      padding: 0 12px;
      height: 100%;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
      flex-shrink: 0;
    }

    .btn-action:hover  { background: #28408a; }
    .btn-action:active { background: #0e2048; }

    .btn-action.btn-disconnect {
      background: #4a1a1a;
      border-color: #985050;
      color: #e8a0a0;
    }

    .status {
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .status.manual   { color: #7898c0; }
    .status.loading  { color: #aaaaaa; }
    .status.live     { color: #40dd80; }
    .status.error    { color: #ee5040; }
    .status.auth-off { color: #607090; }
    .status.auth-on  { color: #40dd80; }

    /* Divider between API-key row and OAuth row */
    .console-divider {
      grid-column: span 4;
      border: none;
      border-top: 1px solid #243a68;
      margin: 2px 0;
    }

    .field-span3 { grid-column: span 3; }
    .field-span4 { grid-column: span 4; }

    /* ════════════════════════════════════════
       STATIC SUBS PILL
    ════════════════════════════════════════ */
    .static-pill {
      background: var(--pill-bg, rgba(45, 63, 110, 0.60));
      border-radius: 0 0 22px 22px;
      width: 180px;
      height: 36px;
      margin: 0 auto;
      overflow: hidden;
      color: transparent;
      font-size: 0;
    }

    .static-pill-label,
    .static-pill-count {
      display: none !important;
    }
  </style>
</head>
<body>

<!-- ── BAR ─────────────────────────────────────────────── -->
<div class="bar-container">
  <div class="bar-row" id="barRow">
    <span class="milestone" id="startLabel"></span>
    <div class="bar-track" id="barTrack">
      <div class="bar-fill" id="barFill" style="width:0"></div>
    </div>
    <span class="milestone" id="endLabel"></span>
    <div class="live-count-pill" id="liveCountPill"></div>
    <img class="profile-pic" id="profilePic" src="" alt="streamer" style="left:0">
  </div>
</div>

<!-- ── STATIC SUBS PILL ──────────────────────────────────────── -->
<div class="static-pill"></div>

<!-- ── NOTIFICATIONS ──────────────────────────────────────── -->
<div class="notif-row">
  <span class="notif-text" id="notifText"></span>
</div>

<!-- ── CONTROL CONSOLE ────────────────────────────────────
     OBS: alt-drag the bottom edge of this source upward
     to crop out this panel. The bar stays visible.
──────────────────────────────────────────────────────── -->
<div class="console">
  <div class="console-header">
    <span class="console-title">⚙ Control Console</span>
    <span class="console-tip">OBS tip: alt-drag the bottom edge of this source upward to hide this panel</span>
    <button class="btn-action" id="btnTestNotif" style="margin-left:16px;white-space:nowrap;flex-shrink:0;">🔔 Test Notification</button>
  </div>

  <div class="console-grid">

    <!-- Row 1: milestones + colours -->
    <div class="field">
      <label>Start Milestone</label>
      <input id="c-start" type="number" placeholder="30000">
    </div>
    <div class="field">
      <label>End Milestone</label>
      <input id="c-end" type="number" placeholder="40000">
    </div>
    <div class="field">
      <label>Next Goal</label>
      <input id="c-next" type="number" placeholder="35000">
    </div>
    <div class="field">
      <label>Bar Fill Colour</label>
      <input id="c-barcolor" type="color" value="#5ee8fc">
    </div>

    <!-- Row 2: colour pickers -->
    <div class="field">
      <label>Unfilled Slots Colour</label>
      <input id="c-trackcolor" type="color" value="#2c3d5e">
    </div>
    <div class="field">
      <label>Background Pill Colour</label>
      <input id="c-pillcolor" type="color" value="#2d3f6e">
    </div>
    <div class="field field-span2">
      <label>Profile Pic — local filename or full URL</label>
      <input id="c-pic" type="text" placeholder="profile.jpg  or  https://…">
    </div>

    <!-- Row 3: SE JWT -->
    <div class="field field-span4">
      <label>StreamElements JWT — positions the bar (streamelements.com → profile → Show Secrets)</label>
      <input id="c-se-jwt" type="password" placeholder="eyJ…">
    </div>

    <!-- Row 3: actions -->
    <div class="field">
      <label>Static Sub Count</label>
      <input id="c-static-subs" type="number" placeholder="0">
    </div>
    <div class="field">
      <label>Auto-refresh (seconds)</label>
      <input id="c-refresh" type="number" placeholder="60" min="10">
    </div>
    <div class="field actions-cell field-span2">
      <label>​</label>
      <div class="console-actions">
        <button class="btn-action btn-disconnect" id="btnClearSE">✕ Clear SE</button>
        <span class="status auth-off" id="seBadge">● Not connected</span>
        <button class="btn-action" id="btnRefresh">↻ Refresh</button>
      </div>
    </div>


  </div>

</div>

<script>
// ================================================================
//  DEFAULTS — first-run values; overridden by console / localStorage
// ================================================================
const DEFAULTS = {
  startMilestone:  30000,         // Left end of bar
  endMilestone:    40000,         // Right end of bar
  nextMilestone:   35000,         // Next milestone label
  profilePicUrl:   'profile.jpg', // Local filename or URL
  barColor:        '#5ee8fc',     // Bar fill colour
  trackColor:      '#2c3d5e',     // Unfilled slot colour
  pillColor:       '#2d3f6e',     // Background pill colour
  streamElementsJwt: '',          // SE JWT — positions the bar
  refreshSeconds:  60,            // Auto-refresh interval
  staticSubCount:  0,             // Static subscriber count shown under bar
};

const CONFIG = Object.assign({}, DEFAULTS);

// ================================================================

const fmtK = n => {
  if (n >= 1e6) return (n / 1e6) + 'M';
  if (n >= 1e3) return (n / 1e3) + 'K';
  return String(n);
};

// ── Persistence ──────────────────────────────────────────────────
function loadSaved() {
  try {
    Object.assign(CONFIG, JSON.parse(localStorage.getItem('subbar_config') || '{}'));
  } catch (e) { /* first run */ }
}

function saveConfig() {
  localStorage.setItem('subbar_config', JSON.stringify(CONFIG));
}

// ── SE badge ─────────────────────────────────────────────────────
function setSeBadge(state) {
  const el = document.getElementById('seBadge');
  if (!el) return;
  el.className   = 'status ' + state;
  el.textContent = state === 'auth-on' ? '● Connected ✓' : '● Not connected';
}

// ── StreamElements fetch ──────────────────────────────────────────
async function fetchStreamElementsSubs() {
  if (!CONFIG.streamElementsJwt) return null;
  try {
    const res  = await fetch('https://api.streamelements.com/kappa/v2/channels/me', {
      headers: { Authorization: `Bearer ${CONFIG.streamElementsJwt}` }
    });
    const data = await res.json();
    if (!res.ok) { setSeBadge('auth-off'); return null; }
    const count = data?.providerTotals?.['subscriber-total'];
    if (count != null) { setSeBadge('auth-on'); return parseInt(count, 10); }
    setSeBadge('auth-off');
    return null;
  } catch (e) {
    setSeBadge('auth-off');
    return null;
  }
}

// ── Bar colour ───────────────────────────────────────────────────
function applyBarColor(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  const dark = `rgb(${Math.max(0,r-38)},${Math.max(0,g-38)},${Math.max(0,b-38)})`;
  document.getElementById('barFill').style.background =
    `repeating-linear-gradient(110deg,${hex} 0px,${hex} 7px,${dark} 7px,${dark} 9px)`;
}

function applyTrackColor(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  const dark = `rgb(${Math.max(0,r-18)},${Math.max(0,g-18)},${Math.max(0,b-18)})`;
  document.documentElement.style.setProperty('--track-light', hex);
  document.documentElement.style.setProperty('--track-dark',  dark);
}

function applyPillColor(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  document.documentElement.style.setProperty('--pill-bg', `rgba(${r},${g},${b},0.60)`);
}

// ── Bar rendering ────────────────────────────────────────────────
function positionIndicator(pct) {
  const row   = document.getElementById('barRow');
  const track = document.getElementById('barTrack');
  const pic   = document.getElementById('profilePic');
  const pill  = document.getElementById('liveCountPill');
  const rR    = row.getBoundingClientRect();
  const tR    = track.getBoundingClientRect();
  const trackLeft = tR.left - rR.left;
  const x = Math.max(trackLeft, Math.min(trackLeft + tR.width * pct, trackLeft + tR.width));
  pic.style.left  = x + 'px';
  if (pill) pill.style.left = x + 'px';
}

function updateUI(fillPct, count) {
  const pct = Math.max(0, Math.min(1, fillPct / 100));
  document.getElementById('barFill').style.width    = pct * 100 + '%';
  document.getElementById('startLabel').textContent = fmtK(CONFIG.startMilestone);
  document.getElementById('endLabel').textContent   = fmtK(CONFIG.endMilestone);
  document.getElementById('profilePic').src         = CONFIG.profilePicUrl;
  if (count != null) {
    const pill = document.getElementById('liveCountPill');
    if (pill) pill.textContent = count.toLocaleString();
  }
  requestAnimationFrame(() => positionIndicator(pct));
}

let refreshTimer = null;

function startRefreshTimer() {
  if (refreshTimer) clearInterval(refreshTimer);
  if (CONFIG.streamElementsJwt) {
    refreshTimer = setInterval(refresh, Math.max(10, CONFIG.refreshSeconds) * 1000);
  }
}

async function refresh() {
  let fillPct = 0;
  let count = null;
  if (CONFIG.streamElementsJwt) {
    count = await fetchStreamElementsSubs();
    if (count !== null) {
      fillPct = (count - CONFIG.startMilestone)
              / (CONFIG.endMilestone - CONFIG.startMilestone) * 100;
    }
  }
  updateUI(fillPct, count);
}

// ── Console wiring ───────────────────────────────────────────────
function initConsole() {
  const bindings = [
    { id: 'c-start',       key: 'startMilestone', parse: Number },
    { id: 'c-end',         key: 'endMilestone',   parse: Number },
    { id: 'c-next',        key: 'nextMilestone',  parse: Number },
    { id: 'c-pic',         key: 'profilePicUrl',  parse: String },
    { id: 'c-refresh',     key: 'refreshSeconds', parse: Number },
  ];

  for (const { id, key, parse } of bindings) {
    const el = document.getElementById(id);
    if (!el) continue;
    el.value = CONFIG[key];
    el.addEventListener('input', () => {
      const raw = el.value.trim();
      if (raw !== '') CONFIG[key] = parse(raw);
      saveConfig();
      refresh();
    });
  }

  const staticSubEl = document.getElementById('c-static-subs');
  if (staticSubEl) {
    staticSubEl.value = CONFIG.staticSubCount || '';
    staticSubEl.addEventListener('input', () => {
      const raw = staticSubEl.value.trim();
      CONFIG.staticSubCount = raw !== '' ? Number(raw) : 0;
      saveConfig();
      updateStaticSubDisplay();
    });
  }

  const colorEl = document.getElementById('c-barcolor');
  if (colorEl) {
    colorEl.value = CONFIG.barColor;
    colorEl.addEventListener('input', () => {
      CONFIG.barColor = colorEl.value;
      saveConfig();
      applyBarColor(CONFIG.barColor);
    });
  }

  const trackEl = document.getElementById('c-trackcolor');
  if (trackEl) {
    trackEl.value = CONFIG.trackColor;
    trackEl.addEventListener('input', () => {
      CONFIG.trackColor = trackEl.value;
      saveConfig();
      applyTrackColor(CONFIG.trackColor);
    });
  }

  const pillEl = document.getElementById('c-pillcolor');
  if (pillEl) {
    pillEl.value = CONFIG.pillColor;
    pillEl.addEventListener('input', () => {
      CONFIG.pillColor = pillEl.value;
      saveConfig();
      applyPillColor(CONFIG.pillColor);
    });
  }

  const seEl = document.getElementById('c-se-jwt');
  if (seEl) {
    seEl.value = CONFIG.streamElementsJwt;
    seEl.addEventListener('input', () => {
      CONFIG.streamElementsJwt = seEl.value.trim();
      saveConfig();
      setSeBadge(CONFIG.streamElementsJwt ? 'auth-on' : 'auth-off');
      startRefreshTimer();
      refresh();
      connectSESocket();
    });
  }

  document.getElementById('btnClearSE')?.addEventListener('click', () => {
    CONFIG.streamElementsJwt = '';
    saveConfig();
    if (seEl) seEl.value = '';
    setSeBadge('auth-off');
    startRefreshTimer();
    refresh();
    connectSESocket();
  });

  document.getElementById('btnRefresh')?.addEventListener('click', refresh);

  const testMessages = [
    'RoryPlays has just subscribed!',
    'xXSniper99Xx has resubscribed for 6 months!',
    'GiftKing gifted a sub to LuckyViewer!',
    'MegaFan gifted 5 subs to the community!',
  ];
  let testIdx = 0;
  document.getElementById('btnTestNotif')?.addEventListener('click', () => {
    showNotif(testMessages[testIdx % testMessages.length]);
    testIdx++;
  });

  if (CONFIG.streamElementsJwt) setSeBadge('auth-on');
}

// ── Static sub display ───────────────────────────────────────────
function updateStaticSubDisplay() {
  const count = CONFIG.staticSubCount;
  if (!count) return;
  const fillPct = (count - CONFIG.startMilestone)
                / (CONFIG.endMilestone - CONFIG.startMilestone) * 100;
  updateUI(fillPct, count);
}

// ── Notification queue ───────────────────────────────────────────
const notifQueue = [];
let notifBusy = false;

function showNotif(msg) {
  notifQueue.push(msg);
  if (!notifBusy) drainNotifQueue();
}

function drainNotifQueue() {
  if (!notifQueue.length) { notifBusy = false; return; }
  notifBusy = true;
  const el = document.getElementById('notifText');
  el.textContent = notifQueue.shift();
  el.classList.add('visible');
  setTimeout(() => {
    el.classList.remove('visible');
    setTimeout(drainNotifQueue, 450); // wait for fade-out
  }, 4500);
}

// ── Streamer.bot WebSocket ───────────────────────────────────────
const SB_WS_PORT = 8080; // Streamer.bot WebSocket server port
let sbSocket = null;
let sbReconnectTimer = null;

function connectStreamerBot() {
  if (sbSocket && sbSocket.readyState < 2) return;
  try {
    sbSocket = new WebSocket(`ws://127.0.0.1:${SB_WS_PORT}/`);
    sbSocket.onmessage = evt => {
      try {
        const msg = JSON.parse(evt.data);
        if (msg.type === 'subCount') {
          const count = parseInt(msg.count, 10);
          if (!isNaN(count) && count > 0) {
            const fillPct = (count - CONFIG.startMilestone)
                          / (CONFIG.endMilestone - CONFIG.startMilestone) * 100;
            updateUI(fillPct, count);
          }
        }
      } catch (e) {}
    };
    sbSocket.onclose = sbSocket.onerror = () => {
      sbSocket = null;
      clearTimeout(sbReconnectTimer);
      sbReconnectTimer = setTimeout(connectStreamerBot, 5000);
    };
  } catch (e) {}
}

// ── SE realtime socket ───────────────────────────────────────────
let seSocket = null;

function connectSESocket() {
  if (seSocket) { seSocket.disconnect(); seSocket = null; }
  if (!CONFIG.streamElementsJwt) return;

  function _connect() {
    seSocket = window.io('https://realtime.streamelements.com', { transports: ['websocket'] });

    seSocket.on('connect', () => {
      seSocket.emit('authenticate', { method: 'jwt', token: CONFIG.streamElementsJwt });
    });

    seSocket.on('event', ({ type, data: d = {} }) => {
      if (type === 'subscriber') {
        if (d.gifted && d.sender) {
          showNotif(`${d.sender} gifted a sub to ${d.username}!`);
        } else if (d.amount > 1) {
          showNotif(`${d.username} has resubscribed for ${d.amount} months!`);
        } else {
          showNotif(`${d.username} has just subscribed!`);
        }
      } else if (type === 'communityGiftPurchase') {
        showNotif(`${d.username} gifted ${d.amount} subs to the community!`);
      }
    });

    // also fire on test events from SE overlay editor
    seSocket.on('event:test', ({ type, data: d = {} }) => {
      seSocket.emit('event', { type, data: d });
    });
  }

  if (window.io) {
    _connect();
  } else {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/socket.io/2.3.0/socket.io.js';
    s.onload = _connect;
    document.head.appendChild(s);
  }
}

// ── Boot ─────────────────────────────────────────────────────────
window.addEventListener('load', () => {
  loadSaved();
  initConsole();
  applyBarColor(CONFIG.barColor);
  applyTrackColor(CONFIG.trackColor);
  applyPillColor(CONFIG.pillColor);
  updateStaticSubDisplay();
  refresh();
  startRefreshTimer();
  connectSESocket();
  connectStreamerBot();
});
</script>
</body>
